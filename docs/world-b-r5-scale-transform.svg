<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#f7f9fb"/>
  <text x="40" y="48" font-family="Microsoft YaHei, Arial" font-size="28" fill="#1f2a37">WORLD-B-R5 Scale Gizmo 缩放闭环</text>
  <text x="40" y="82" font-family="Microsoft YaHei, Arial" font-size="15" fill="#52606d">v0.2.20.18-rz｜自动门禁完成，等待真机验收</text>
  <g font-family="Microsoft YaHei, Arial" font-size="16">
    <rect x="70" y="130" width="190" height="70" rx="8" fill="#ffffff" stroke="#8aa4c0"/>
    <text x="95" y="158" fill="#1f2a37">SelectionKey</text>
    <text x="95" y="183" fill="#52606d">缩放工具内可直接切 B</text>
    <rect x="330" y="130" width="230" height="70" rx="8" fill="#ffffff" stroke="#8aa4c0"/>
    <text x="360" y="158" fill="#1f2a37">TransformSession.BeginScale</text>
    <text x="360" y="183" fill="#52606d">StartScale + Handle</text>
    <rect x="640" y="130" width="230" height="70" rx="8" fill="#ffffff" stroke="#8aa4c0"/>
    <text x="668" y="158" fill="#1f2a37">ScaleGizmoDrag</text>
    <text x="668" y="183" fill="#52606d">exp 投影倍率，最小 0.01</text>
    <rect x="70" y="285" width="230" height="76" rx="8" fill="#ffffff" stroke="#8aa4c0"/>
    <text x="96" y="314" fill="#1f2a37">SceneRenderSnapshot</text>
    <text x="96" y="339" fill="#52606d">Preview Scale 实时投影</text>
    <rect x="365" y="285" width="230" height="76" rx="8" fill="#ffffff" stroke="#8aa4c0"/>
    <text x="394" y="314" fill="#1f2a37">RenderProjection</text>
    <text x="394" y="339" fill="#52606d">可见性 / 轴长 / 朝向</text>
    <rect x="660" y="285" width="230" height="76" rx="8" fill="#ffffff" stroke="#8aa4c0"/>
    <text x="693" y="314" fill="#1f2a37">Vulkan 绘制</text>
    <text x="693" y="339" fill="#52606d">三轴端方块 + 中心柄</text>
  </g>
  <g stroke="#536d89" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M260 165 H330"/>
    <path d="M560 165 H640"/>
    <path d="M755 200 C755 245 185 240 185 285"/>
    <path d="M300 323 H365"/>
    <path d="M595 323 H660"/>
  </g>
  <g font-family="Microsoft YaHei, Arial" font-size="14" fill="#415466">
    <text x="83" y="430">验收重点：X/Y/Z 只改对应分量；Uniform 三轴同倍率；Undo/Redo 一次对应一次拖动。</text>
    <text x="83" y="458">禁止项：不做负缩放、镜像、多选、Pivot、吸附、数值输入、Local/Global、父子传播、WarCore。</text>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#536d89"/>
    </marker>
  </defs>
</svg>
