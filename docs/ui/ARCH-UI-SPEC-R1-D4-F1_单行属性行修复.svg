  <text x="28" y="214" font-size="12" fill="#5D6F7C">只读字段无响应式（只有输入控件才 &lt;360 上下）</text>
  <text x="28" y="232" font-size="12" fill="#5D6F7C">uiLabel 12 / uiValue 13 / uiSection 14（公共 Token）</text>

  <!-- 调试页：键值行 96 列单行 -->
  <rect x="298" y="44" width="270" height="196" rx="6" fill="#F8FAFB" stroke="#D5DEE4" stroke-width="1"/>
  <text x="310" y="66" font-size="14" font-weight="bold" fill="#243744">交互事务</text>
  <line x1="310" y1="72" x2="556" y2="72" stroke="#D5DEE4" stroke-width="1"/>
