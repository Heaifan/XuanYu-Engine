<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560">
  <style>
    text{font-family:Microsoft YaHei,Segoe UI,Arial,sans-serif;fill:#233247}
    .title{font-size:26px;font-weight:700}
    .label{font-size:17px;font-weight:700}
    .small{font-size:14px;fill:#52677f}
    .box{fill:#f7fbff;stroke:#7aa6d9;stroke-width:2;rx:8}
    .ok{fill:#f3fbf2;stroke:#73ad73;stroke-width:2;rx:8}
    .warn{fill:#fff8ed;stroke:#d5a049;stroke-width:2;rx:8}
    .line{stroke:#8aa0b8;stroke-width:2;fill:none;marker-end:url(#arrow)}
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#8aa0b8"/></marker>
  </defs>
  <rect x="18" y="18" width="944" height="524" fill="#ffffff" stroke="#d8e2ee"/>
  <text x="490" y="58" text-anchor="middle" class="title">WORLD-A-UI-R1 / v0.2.18.20-fix 显示清理</text>
  <rect x="64" y="110" width="250" height="126" class="ok"/>
  <text x="189" y="145" text-anchor="middle" class="label">日志阅读顺序</text>
  <text x="92" y="178" class="small">时间 / 级别 / 来源 / 模块</text>
  <text x="92" y="204" class="small">消息 / 详情</text>
  <text x="92" y="226" class="small">阶段代号不作运行模块名</text>
  <rect x="365" y="110" width="250" height="126" class="box"/>
  <text x="490" y="145" text-anchor="middle" class="label">树形视觉统一</text>
  <text x="393" y="178" class="small">Project Tree 与 Hierarchy Tree</text>
  <text x="393" y="204" class="small">分支线 / 缩进 / 行高 / 选中态</text>
  <text x="393" y="226" class="small">SVG Path 图标同源</text>
  <rect x="666" y="110" width="250" height="126" class="ok"/>
  <text x="791" y="145" text-anchor="middle" class="label">中文显示映射</text>
  <text x="694" y="178" class="small">测试实体 / 区域 / 活跃态</text>
  <text x="694" y="204" class="small">Inspector 字段中文化</text>
  <text x="694" y="226" class="small">内部 C# 标识保持英文</text>
  <path d="M314 173H365" class="line"/>
  <path d="M615 173H666" class="line"/>
  <rect x="96" y="312" width="250" height="104" class="warn"/>
  <text x="221" y="348" text-anchor="middle" class="label">禁止扩张</text>
  <text x="124" y="380" class="small">不接 Picking 正式主链</text>
  <text x="124" y="404" class="small">不改 SpatialIndex / ECS / 保存</text>
  <rect x="365" y="302" width="250" height="124" class="box"/>
  <text x="490" y="338" text-anchor="middle" class="label">事实源边界</text>
  <text x="393" y="370" class="small">GlobalWorld / EntityRegistry 不变</text>
  <text x="393" y="394" class="small">树与 Inspector 只做投影</text>
  <text x="393" y="418" class="small">日志只做可读事实记录</text>
  <rect x="634" y="312" width="250" height="104" class="ok"/>
  <text x="759" y="348" text-anchor="middle" class="label">治理固化</text>
  <text x="662" y="380" class="small">开发宪法 / dev-rules 同步</text>
  <text x="662" y="404" class="small">file-tree / changelog 同步</text>
  <path d="M346 364H365" class="line"/>
  <path d="M615 364H634" class="line"/>
</svg>
