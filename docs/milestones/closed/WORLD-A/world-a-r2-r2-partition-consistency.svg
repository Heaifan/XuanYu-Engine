<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620">
  <rect width="1120" height="620" fill="#f8fafc"/>
  <text x="560" y="52" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="30" fill="#243447">WORLD-A-R2-R2 分区一致性 Gate</text>
  <rect x="70" y="110" width="300" height="330" rx="10" fill="#e8f2ff" stroke="#4b86d1" stroke-width="2"/>
  <text x="220" y="148" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="22" fill="#1c5c9c">Partition Invariant</text>
  <text x="112" y="195" font-family="Microsoft YaHei, Arial" font-size="18" fill="#243447">Alive Entity 恰好一份 Membership</text>
  <text x="112" y="230" font-family="Microsoft YaHei, Arial" font-size="18" fill="#243447">Region = Strategy(GlobalPosition)</text>
  <text x="112" y="265" font-family="Microsoft YaHei, Arial" font-size="18" fill="#243447">EntityId 迁移前后不变</text>
  <rect x="410" y="110" width="300" height="330" rx="10" fill="#eaf8ef" stroke="#48a868" stroke-width="2"/>
  <text x="560" y="148" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="22" fill="#277043">Scale Migration</text>
  <text x="452" y="195" font-family="Microsoft YaHei, Arial" font-size="18" fill="#243447">1000 Entity</text>
  <text x="452" y="230" font-family="Microsoft YaHei, Arial" font-size="18" fill="#243447">10000 次随机迁移</text>
  <text x="452" y="265" font-family="Microsoft YaHei, Arial" font-size="18" fill="#243447">每次迁移后立即校验</text>
  <rect x="750" y="110" width="300" height="330" rx="10" fill="#fff4df" stroke="#d99b32" stroke-width="2"/>
  <text x="900" y="148" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="22" fill="#9a650e">Editor Projection</text>
  <text x="792" y="195" font-family="Microsoft YaHei, Arial" font-size="18" fill="#243447">Migration 复用 Entity node</text>
  <text x="792" y="230" font-family="Microsoft YaHei, Arial" font-size="18" fill="#243447">Destroy 清理 node cache</text>
  <text x="792" y="265" font-family="Microsoft YaHei, Arial" font-size="18" fill="#243447">Region 只是调试投影</text>
  <rect x="185" y="490" width="750" height="66" rx="8" fill="#ffffff" stroke="#aab7c8"/>
  <text x="560" y="531" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="22" fill="#243447">Position 和 Region 必须始终是一件事实的两个一致表现</text>
</svg>
