<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <rect width="1200" height="760" fill="#f7fafc"/>
  <style>
    .title{font:700 30px 'Microsoft YaHei',sans-serif;fill:#16324f}.sub{font:16px 'Microsoft YaHei',sans-serif;fill:#52677d}
    .box{fill:#fff;stroke:#4c78a8;stroke-width:2;rx:14}.fix{fill:#eef8f1;stroke:#3f8f5f;stroke-width:2;rx:14}
    .warn{fill:#fff6e8;stroke:#d28b27;stroke-width:2;rx:14}.txt{font:18px 'Microsoft YaHei',sans-serif;fill:#18344f;text-anchor:middle}
    .small{font:14px 'Microsoft YaHei',sans-serif;fill:#52677d;text-anchor:middle}.arrow{stroke:#69849d;stroke-width:3;fill:none;marker-end:url(#a)}
  </style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#69849d"/></marker></defs>
  <text x="600" y="52" class="title" text-anchor="middle">WORLD-A-R0 唯一坐标事实链</text>
  <text x="600" y="82" class="sub" text-anchor="middle">右手系 · Z-Up · XY 水平面 · 不定义世界唯一 Forward</text>
  <rect x="410" y="110" width="380" height="82" class="fix"/><text x="600" y="143" class="txt">玄域统一 World Space</text><text x="600" y="171" class="small">X × Y = Z；+Z 向上；双精度逻辑空间</text>
  <rect x="75" y="245" width="250" height="84" class="box"/><text x="200" y="279" class="txt">Transform</text><text x="200" y="307" class="small">Position 世界轴；旋转遵守右手规则</text>
  <rect x="475" y="245" width="250" height="84" class="box"/><text x="600" y="279" class="txt">Camera / View</text><text x="600" y="307" class="small">Forward 显式；Right / Up 正交</text>
  <rect x="875" y="245" width="250" height="84" class="box"/><text x="1000" y="279" class="txt">Spatial / Picking</text><text x="1000" y="307" class="small">同一 World 与 ViewProjection</text>
  <path d="M520 192 L240 245" class="arrow"/><path d="M600 192 L600 245" class="arrow"/><path d="M680 192 L960 245" class="arrow"/>
  <rect x="420" y="390" width="360" height="84" class="fix"/><text x="600" y="424" class="txt">Core View / Projection</text><text x="600" y="452" class="small">标准右手矩阵；Screen 与 Picking 同源</text>
  <path d="M600 329 L600 390" class="arrow"/>
  <rect x="420" y="530" width="360" height="84" class="box"/><text x="600" y="564" class="txt">Vulkan Render Boundary</text><text x="600" y="592" class="small">翻 Clip Y 副本；World / Picking 不受污染</text>
  <path d="M600 474 L600 530" class="arrow"/>
  <rect x="65" y="530" width="270" height="84" class="box"/><text x="200" y="564" class="txt">Screen → World Ray</text><text x="200" y="592" class="small">逆同一矩阵；禁止二次翻 Y</text>
  <path d="M420 432 C315 432 270 480 240 530" class="arrow"/><path d="M335 572 C500 690 875 650 960 329" class="arrow"/>
  <rect x="865" y="530" width="270" height="84" class="warn"/><text x="1000" y="564" class="txt">Gizmo</text><text x="1000" y="592" class="small">Global=世界基轴；Local 待正式 Rotation</text>
  <path d="M780 432 C880 432 930 480 965 530" class="arrow"/>
  <text x="600" y="714" class="sub" text-anchor="middle">禁止：Ground / Grid / Skybox / Terrain / PBR / 地球 Mesh / 世界地图 / 玩法扩张</text>
</svg>
