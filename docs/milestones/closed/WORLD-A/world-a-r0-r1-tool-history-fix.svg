<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <rect width="1200" height="760" fill="#f7fafc"/>
  <style>
    .title{font:700 30px 'Microsoft YaHei',sans-serif;fill:#17324d}.sub{font:16px 'Microsoft YaHei',sans-serif;fill:#52677d}
    .box{fill:#fff;stroke:#4c78a8;stroke-width:2;rx:14}.ok{fill:#eef8f1;stroke:#3f8f5f;stroke-width:2;rx:14}
    .cmd{fill:#f4f7ff;stroke:#6b83c9;stroke-width:2;rx:14}.warn{fill:#fff6e8;stroke:#d28b27;stroke-width:2;rx:14}
    .txt{font:18px 'Microsoft YaHei',sans-serif;fill:#18344f;text-anchor:middle}.small{font:14px 'Microsoft YaHei',sans-serif;fill:#52677d;text-anchor:middle}
    .arrow{stroke:#69849d;stroke-width:3;fill:none;marker-end:url(#a)}
  </style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#69849d"/></marker></defs>
  <text x="600" y="52" class="title" text-anchor="middle">WORLD-A-R0-R1 工具状态与 Redo 修复</text>
  <text x="600" y="82" class="sub" text-anchor="middle">一个 ActiveTool 事实 · Snap 独立 Toggle · Redo 恢复 AfterSnapshot</text>
  <rect x="80" y="130" width="300" height="92" class="ok"/><text x="230" y="166" class="txt">ActiveTool</text><text x="230" y="194" class="small">选择 / 框选 / 移动 / 旋转 / 缩放</text>
  <rect x="450" y="130" width="300" height="92" class="cmd"/><text x="600" y="166" class="txt">Command</text><text x="600" y="194" class="small">聚焦 / 撤销 / 重做；不改工具</text>
  <rect x="820" y="130" width="300" height="92" class="box"/><text x="970" y="166" class="txt">Toggle</text><text x="970" y="194" class="small">吸附：开启 / 关闭</text>
  <rect x="260" y="310" width="220" height="82" class="box"/><text x="370" y="344" class="txt">顶部高亮</text><text x="370" y="372" class="small">只看 ActiveTool</text>
  <rect x="490" y="310" width="220" height="82" class="box"/><text x="600" y="344" class="txt">右上工具文本</text><text x="600" y="372" class="small">工具：移动</text>
  <rect x="720" y="310" width="220" height="82" class="box"/><text x="830" y="344" class="txt">底部工具文本</text><text x="830" y="372" class="small">工具：移动</text>
  <path d="M230 222 C260 270 315 290 370 310" class="arrow"/><path d="M230 222 C380 285 500 280 600 310" class="arrow"/><path d="M230 222 C500 285 700 280 830 310" class="arrow"/>
  <path d="M970 222 C970 275 920 292 850 310" class="arrow"/><text x="995" y="286" class="small">只显示开关状态</text>
  <rect x="120" y="505" width="190" height="78" class="box"/><text x="215" y="538" class="txt">P0</text><text x="215" y="566" class="small">提交前位置</text>
  <rect x="380" y="505" width="190" height="78" class="ok"/><text x="475" y="538" class="txt">Move Commit</text><text x="475" y="566" class="small">Before=P0 / After=P1</text>
  <rect x="640" y="505" width="190" height="78" class="box"/><text x="735" y="538" class="txt">Undo</text><text x="735" y="566" class="small">Apply Before</text>
  <rect x="900" y="505" width="190" height="78" class="box"/><text x="995" y="538" class="txt">Redo</text><text x="995" y="566" class="small">Apply After</text>
  <path d="M310 544 L380 544" class="arrow"/><path d="M570 544 L640 544" class="arrow"/><path d="M830 544 L900 544" class="arrow"/>
  <text x="600" y="690" class="sub" text-anchor="middle">禁止：Snap 抢占工具 · Undo/Redo 生成新 History · Redo 重新模拟输入 Delta · WORLD-A-R1 扩张</text>
</svg>
