<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560">
  <rect width="980" height="560" fill="#f8fbff"/>
  <text x="490" y="42" text-anchor="middle" font-size="28" font-family="Microsoft YaHei, Arial" fill="#19324a">WORLD-A-R1-R1：Scene / Editor 消费 GlobalWorld</text>
  <text x="490" y="74" text-anchor="middle" font-size="15" font-family="Microsoft YaHei, Arial" fill="#526b82">旧 SceneStateOwner 不再拥有第二份实体真相，只负责投影、编辑会话与派生索引</text>

  <rect x="70" y="120" width="230" height="96" rx="16" fill="#dff1ff" stroke="#448bc0" stroke-width="2"/>
  <text x="185" y="157" text-anchor="middle" font-size="22" font-family="Microsoft YaHei, Arial" fill="#12395c">GlobalWorld</text>
  <text x="185" y="187" text-anchor="middle" font-size="14" font-family="Microsoft YaHei, Arial" fill="#31516d">唯一生命周期入口</text>

  <rect x="380" y="120" width="230" height="96" rx="16" fill="#e8f7e8" stroke="#4f9e5c" stroke-width="2"/>
  <text x="495" y="157" text-anchor="middle" font-size="22" font-family="Microsoft YaHei, Arial" fill="#1d4d28">EntityRegistry</text>
  <text x="495" y="187" text-anchor="middle" font-size="14" font-family="Microsoft YaHei, Arial" fill="#37653d">EntityId + Entity State</text>

  <rect x="690" y="120" width="220" height="96" rx="16" fill="#fff0cc" stroke="#d59a16" stroke-width="2"/>
  <text x="800" y="157" text-anchor="middle" font-size="22" font-family="Microsoft YaHei, Arial" fill="#6b4700">SceneStateOwner</text>
  <text x="800" y="187" text-anchor="middle" font-size="14" font-family="Microsoft YaHei, Arial" fill="#745822">投影 / 会话 / 派生索引</text>

  <path d="M302 168 H372" stroke="#31516d" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M612 168 H682" stroke="#37653d" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="110" y="315" width="170" height="86" rx="14" fill="#ffffff" stroke="#b9c7d6" stroke-width="2"/>
  <text x="195" y="350" text-anchor="middle" font-size="19" font-family="Microsoft YaHei, Arial" fill="#26394a">Hierarchy</text>
  <text x="195" y="378" text-anchor="middle" font-size="14" font-family="Microsoft YaHei, Arial" fill="#526b82">World Projection</text>

  <rect x="310" y="315" width="170" height="86" rx="14" fill="#ffffff" stroke="#b9c7d6" stroke-width="2"/>
  <text x="395" y="350" text-anchor="middle" font-size="19" font-family="Microsoft YaHei, Arial" fill="#26394a">Inspector</text>
  <text x="395" y="378" text-anchor="middle" font-size="14" font-family="Microsoft YaHei, Arial" fill="#526b82">EntityId 查询</text>

  <rect x="510" y="315" width="170" height="86" rx="14" fill="#ffffff" stroke="#b9c7d6" stroke-width="2"/>
  <text x="595" y="350" text-anchor="middle" font-size="19" font-family="Microsoft YaHei, Arial" fill="#26394a">RenderSnapshot</text>
  <text x="595" y="378" text-anchor="middle" font-size="14" font-family="Microsoft YaHei, Arial" fill="#526b82">单向生成</text>

  <rect x="710" y="315" width="170" height="86" rx="14" fill="#ffffff" stroke="#b9c7d6" stroke-width="2"/>
  <text x="795" y="350" text-anchor="middle" font-size="19" font-family="Microsoft YaHei, Arial" fill="#26394a">Picking / Gizmo</text>
  <text x="795" y="378" text-anchor="middle" font-size="14" font-family="Microsoft YaHei, Arial" fill="#526b82">稳定 EntityId</text>

  <path d="M800 218 C800 270,195 260,195 307" stroke="#778da3" stroke-width="3" fill="none" stroke-dasharray="8 7" marker-end="url(#gray)"/>
  <path d="M800 218 C800 270,395 260,395 307" stroke="#778da3" stroke-width="3" fill="none" stroke-dasharray="8 7" marker-end="url(#gray)"/>
  <path d="M800 218 C800 270,595 260,595 307" stroke="#778da3" stroke-width="3" fill="none" stroke-dasharray="8 7" marker-end="url(#gray)"/>
  <path d="M800 218 V307" stroke="#778da3" stroke-width="3" fill="none" stroke-dasharray="8 7" marker-end="url(#gray)"/>

  <text x="490" y="475" text-anchor="middle" font-size="16" font-family="Microsoft YaHei, Arial" fill="#40566b">Transform Commit / Undo / Redo：全部回写同一个 World Entity State，再刷新投影</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#31516d"/>
    </marker>
    <marker id="gray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#778da3"/>
    </marker>
  </defs>
</svg>
