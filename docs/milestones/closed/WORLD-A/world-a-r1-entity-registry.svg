<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560">
  <rect width="980" height="560" fill="#f7fbff"/>
  <text x="490" y="42" text-anchor="middle" font-size="28" font-family="Microsoft YaHei, Arial" fill="#17324d">WORLD-A-R1：Global World + Entity Registry</text>
  <text x="490" y="76" text-anchor="middle" font-size="15" font-family="Microsoft YaHei, Arial" fill="#50657a">唯一实体事实源：GlobalWorld → EntityRegistry → Entity State</text>

  <rect x="70" y="130" width="220" height="110" rx="18" fill="#dff1ff" stroke="#4d91c8" stroke-width="2"/>
  <text x="180" y="168" text-anchor="middle" font-size="22" font-family="Microsoft YaHei, Arial" fill="#12395c">GlobalWorld</text>
  <text x="180" y="199" text-anchor="middle" font-size="15" font-family="Microsoft YaHei, Arial" fill="#31516d">世界生命周期入口</text>
  <text x="180" y="222" text-anchor="middle" font-size="14" font-family="Consolas, Arial" fill="#31516d">Create / Destroy / Get</text>

  <rect x="380" y="130" width="240" height="110" rx="18" fill="#e8f7e8" stroke="#4f9e5c" stroke-width="2"/>
  <text x="500" y="168" text-anchor="middle" font-size="22" font-family="Microsoft YaHei, Arial" fill="#1d4d28">EntityRegistry</text>
  <text x="500" y="199" text-anchor="middle" font-size="15" font-family="Microsoft YaHei, Arial" fill="#37653d">分配并保存稳定 EntityId</text>
  <text x="500" y="222" text-anchor="middle" font-size="14" font-family="Consolas, Arial" fill="#37653d">TryGet / Exists</text>

  <rect x="710" y="130" width="210" height="110" rx="18" fill="#fff0cc" stroke="#d59a16" stroke-width="2"/>
  <text x="815" y="168" text-anchor="middle" font-size="22" font-family="Microsoft YaHei, Arial" fill="#6b4700">Entity State</text>
  <text x="815" y="199" text-anchor="middle" font-size="15" font-family="Microsoft YaHei, Arial" fill="#745822">EntityKey / 名称 / 类型</text>
  <text x="815" y="222" text-anchor="middle" font-size="14" font-family="Microsoft YaHei, Arial" fill="#745822">正式 Transform 快照</text>

  <path d="M292 185 H372" stroke="#31516d" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M622 185 H702" stroke="#37653d" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <text x="335" y="174" text-anchor="middle" font-size="14" font-family="Microsoft YaHei, Arial" fill="#31516d">委托</text>
  <text x="662" y="174" text-anchor="middle" font-size="14" font-family="Microsoft YaHei, Arial" fill="#37653d">拥有</text>

  <rect x="92" y="330" width="810" height="110" rx="18" fill="#ffffff" stroke="#b6c7d8" stroke-width="2"/>
  <text x="497" y="365" text-anchor="middle" font-size="20" font-family="Microsoft YaHei, Arial" fill="#26394a">消费方只能读取或投影，不拥有第二份真相</text>
  <text x="497" y="398" text-anchor="middle" font-size="15" font-family="Microsoft YaHei, Arial" fill="#50657a">UI / Renderer / Hierarchy / Inspector / Snapshot / Picking / Gizmo</text>
  <text x="497" y="424" text-anchor="middle" font-size="15" font-family="Microsoft YaHei, Arial" fill="#50657a">后续 R1+ 才允许在此事实源上接入组织、分区、空间索引或存档</text>

  <path d="M500 242 V320" stroke="#778da3" stroke-width="3" fill="none" stroke-dasharray="8 7" marker-end="url(#arrowGray)"/>
  <text x="610" y="286" font-size="14" font-family="Microsoft YaHei, Arial" fill="#65798d">只读快照 / 查询结果</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#31516d"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#778da3"/>
    </marker>
  </defs>
</svg>
