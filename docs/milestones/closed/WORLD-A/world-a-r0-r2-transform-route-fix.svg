<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <rect width="1200" height="760" fill="#f7fafc"/>
  <style>
    .title{font:700 30px 'Microsoft YaHei',sans-serif;fill:#17324d}.sub{font:16px 'Microsoft YaHei',sans-serif;fill:#52677d}
    .box{fill:#fff;stroke:#4c78a8;stroke-width:2;rx:14}.ok{fill:#eef8f1;stroke:#3f8f5f;stroke-width:2;rx:14}
    .deny{fill:#fff6e8;stroke:#d28b27;stroke-width:2;rx:14}.txt{font:18px 'Microsoft YaHei',sans-serif;fill:#18344f;text-anchor:middle}
    .small{font:14px 'Microsoft YaHei',sans-serif;fill:#52677d;text-anchor:middle}.arrow{stroke:#69849d;stroke-width:3;fill:none;marker-end:url(#a)}
  </style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#69849d"/></marker></defs>
  <text x="600" y="52" class="title" text-anchor="middle">WORLD-A-R0-R2 Transform 输入路由</text>
  <text x="600" y="82" class="sub" text-anchor="middle">PointerDown 只能从唯一 ActiveTool 快照创建 SessionTool</text>
  <rect x="75" y="130" width="230" height="86" class="box"/><text x="190" y="164" class="txt">点击「移动」</text><text x="190" y="192" class="small">ActiveTool=移动</text>
  <rect x="380" y="130" width="230" height="86" class="ok"/><text x="495" y="164" class="txt">PointerDown</text><text x="495" y="192" class="small">读取当前快照</text>
  <rect x="685" y="130" width="230" height="86" class="ok"/><text x="800" y="164" class="txt">Begin Capture</text><text x="800" y="192" class="small">SessionTool=移动</text>
  <rect x="515" y="300" width="260" height="88" class="box"/><text x="645" y="334" class="txt">Move Session</text><text x="645" y="362" class="small">Preview / Commit 只走移动</text>
  <path d="M305 173 L380 173" class="arrow"/><path d="M610 173 L685 173" class="arrow"/><path d="M800 216 C790 260 735 285 645 300" class="arrow"/>
  <rect x="145" y="500" width="290" height="88" class="deny"/><text x="290" y="534" class="txt">点击「旋转 / 缩放」</text><text x="290" y="562" class="small">当前未实现真实 Transform</text>
  <rect x="765" y="500" width="290" height="88" class="deny"/><text x="910" y="534" class="txt">拒绝 Move Capture</text><text x="910" y="562" class="small">不得伪装成移动 Session</text>
  <path d="M435 544 L765 544" class="arrow"/>
  <rect x="420" y="628" width="360" height="62" class="ok"/><text x="600" y="653" class="txt">低频诊断日志</text><text x="600" y="676" class="small">ActiveTool=移动；SessionTool=移动；Entity=EntityId(...)</text>
  <text x="600" y="724" class="sub" text-anchor="middle">禁止：旧缓存工具 · 默认 TransformMode 猜测 · Rotate / Scale 偷偷执行 Move · WORLD-A-R1 扩张</text>
</svg>
