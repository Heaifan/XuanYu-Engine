  <path d="M230 180 L292 180" stroke="#5b748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M476 180 L538 180" stroke="#5b748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M722 180 L784 180" stroke="#5b748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

