<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#f7f9fc"/>
  <text x="64" y="58" font-family="Microsoft YaHei, Arial, sans-serif" font-size="30" font-weight="700" fill="#162033">WORLD-B-R1 编辑器相机操作实装</text>
  <text x="64" y="92" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#526070">唯一 ObservationCenter 串联 Frame、Orbit、Pan、Dolly；相机不写实体、不写 History、不进入 WarCore</text>

  <rect x="80" y="140" width="250" height="104" rx="8" fill="#ffffff" stroke="#2f80c9" stroke-width="2"/>
  <text x="112" y="176" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f5f8f">Frame</text>
  <text x="112" y="205" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#334155">FrameAll / FrameSelected</text>
  <text x="112" y="228" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#334155">更新 ObservationCenter</text>

  <rect x="390" y="140" width="250" height="104" rx="8" fill="#ffffff" stroke="#2f80c9" stroke-width="2"/>
  <text x="422" y="176" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f5f8f">MMB Orbit</text>
  <text x="422" y="205" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#334155">围绕同一中心旋转</text>
  <text x="422" y="228" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#334155">保距离 / Z-Up / 防翻转</text>

  <rect x="700" y="140" width="250" height="104" rx="8" fill="#ffffff" stroke="#2f80c9" stroke-width="2"/>
  <text x="732" y="176" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f5f8f">Shift + MMB Pan</text>
  <text x="732" y="205" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#334155">Position 与 Center 同移</text>
  <text x="732" y="228" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#334155">Forward / Distance 不变</text>

  <rect x="1010" y="140" width="190" height="104" rx="8" fill="#ffffff" stroke="#2f80c9" stroke-width="2"/>
  <text x="1042" y="176" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f5f8f">Wheel Dolly</text>
  <text x="1042" y="205" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#334155">比例缩放距离</text>
  <text x="1042" y="228" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#334155">不改 FOV / 焦点</text>

  <path d="M330 192H390" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M640 192H700" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M950 192H1010" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="150" y="330" width="300" height="116" rx="8" fill="#ffffff" stroke="#5f9f74" stroke-width="2"/>
  <text x="182" y="366" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#2f6e43">CameraSession</text>
  <text x="182" y="396" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#334155">Begin / Preview / End / Cancel</text>
  <text x="182" y="419" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#334155">Cancel 恢复 StartCamera + Center</text>

  <rect x="490" y="330" width="300" height="116" rx="8" fill="#ffffff" stroke="#5f9f74" stroke-width="2"/>
  <text x="522" y="366" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#2f6e43">输入抢占</text>
  <text x="522" y="396" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#334155">Gizmo Capture 阻止 Camera</text>
  <text x="522" y="419" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#334155">Camera Capture 阻止 Picking / Gizmo</text>

  <rect x="830" y="330" width="300" height="116" rx="8" fill="#ffffff" stroke="#5f9f74" stroke-width="2"/>
  <text x="862" y="366" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#2f6e43">异常取消</text>
  <text x="862" y="396" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#334155">Escape / LostCapture / WM_CANCELMODE</text>
  <text x="862" y="419" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#334155">Resize 中操作统一 Cancel</text>

  <rect x="180" y="530" width="920" height="94" rx="8" fill="#fff8f0" stroke="#d28b3d" stroke-width="2"/>
  <text x="212" y="565" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#7a4a14">仍需真机验收后 CLOSED</text>
  <text x="212" y="596" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#5f4930">自动测试已增至 182 passed；真机需确认 MMB / Shift+MMB / Wheel / Resize / 取消 / 输入抢占真实手感。</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
