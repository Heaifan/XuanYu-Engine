<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430">
  <rect width="980" height="430" fill="#f7f9fc"/>
  <text x="490" y="38" text-anchor="middle" font-size="23" fill="#24364b" font-family="Microsoft YaHei, Arial">ARCH-C-R2-B 正式封版状态</text>
  <text x="490" y="66" text-anchor="middle" font-size="14" fill="#66778a" font-family="Microsoft YaHei, Arial">统一相机、视口与世界射线数学已经通过完整契约测试</text>

  <rect x="55" y="120" width="220" height="100" rx="10" fill="#eef5fb" stroke="#6688a9" stroke-width="2"/>
  <text x="165" y="155" text-anchor="middle" font-size="18" fill="#304f6c" font-family="Microsoft YaHei, Arial">统一空间规则</text>
  <text x="165" y="185" text-anchor="middle" font-size="13" fill="#52677c" font-family="Microsoft YaHei, Arial">相机 / 视口 / 投影</text>

  <rect x="380" y="120" width="220" height="100" rx="10" fill="#edf7f1" stroke="#628f71" stroke-width="2"/>
  <text x="490" y="155" text-anchor="middle" font-size="18" fill="#376047" font-family="Microsoft YaHei, Arial">数学契约验收</text>
  <text x="490" y="185" text-anchor="middle" font-size="13" fill="#52715b" font-family="Microsoft YaHei, Arial">16 项测试全部通过</text>

  <rect x="705" y="120" width="220" height="100" rx="10" fill="#fff8e9" stroke="#b48d4e" stroke-width="2"/>
  <text x="815" y="155" text-anchor="middle" font-size="18" fill="#755923" font-family="Microsoft YaHei, Arial">下一步</text>
  <text x="815" y="185" text-anchor="middle" font-size="13" fill="#806c47" font-family="Microsoft YaHei, Arial">渲染正式接入统一空间事实</text>

  <path d="M275 170 H370" stroke="#66788b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M600 170 H695" stroke="#66788b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="155" y="295" width="670" height="70" rx="10" fill="#f1f5fa" stroke="#8798aa" stroke-width="2"/>
  <text x="490" y="324" text-anchor="middle" font-size="16" fill="#344b63" font-family="Microsoft YaHei, Arial">当前结论：玄域已经知道“屏幕上的一个点，在3D世界里指向哪里”</text>
  <text x="490" y="350" text-anchor="middle" font-size="13" fill="#607489" font-family="Microsoft YaHei, Arial">下一步让 Vulkan 画面也正式遵守同一套空间规则，避免渲染与 Picking 出现两个世界</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#66788b"/>
    </marker>
  </defs>
</svg>
