  <text x="460" y="198" text-anchor="middle" font-size="14" fill="#52715b" font-family="Microsoft YaHei, Arial">命中：SelectEditorItemCommand</text>
  <text x="460" y="227" text-anchor="middle" font-size="14" fill="#52715b" font-family="Microsoft YaHei, Arial">空白：ClearEditorSelectionCommand</text>

  <path d="M585 197 H670" stroke="#628f71" stroke-width="3" fill="none"/>
  <path d="M660 190 L672 197 L660 204" fill="#628f71"/>

