  <text x="150" y="215" text-anchor="middle" font-size="14" fill="#5d7186" font-family="Microsoft YaHei, Arial">PickingResult</text>

  <path d="M245 197 H330" stroke="#6688a9" stroke-width="3" fill="none"/>
  <path d="M320 190 L332 197 L320 204" fill="#6688a9"/>

  <rect x="335" y="125" width="250" height="145" rx="8" fill="#edf7f1" stroke="#628f71" stroke-width="2"/>
