  <text x="800" y="412" text-anchor="middle" font-size="14" fill="#74698a" font-family="Microsoft YaHei, Arial">唯一发布快照</text>

  <path d="M675 392 H545 V480" stroke="#8977a6" stroke-width="3" fill="none"/>
  <path d="M538 470 L545 482 L552 470" fill="#8977a6"/>
  <path d="M925 392 H1055 V480" stroke="#8977a6" stroke-width="3" fill="none"/>
  <path d="M1048 470 L1055 482 L1062 470" fill="#8977a6"/>

  <rect x="420" y="485" width="250" height="85" rx="8" fill="#eef5fb" stroke="#6688a9" stroke-width="2"/>
