  <text x="800" y="199" text-anchor="middle" font-size="15" fill="#755923" font-family="Microsoft YaHei, Arial">Selection 唯一事实所有者</text>
  <text x="800" y="230" text-anchor="middle" font-size="14" fill="#806c47" font-family="Microsoft YaHei, Arial">重复选择幂等，不增加 Revision</text>

  <path d="M800 270 V345" stroke="#b48d4e" stroke-width="3" fill="none"/>
  <path d="M793 335 L800 347 L807 335" fill="#b48d4e"/>
  <rect x="675" y="350" width="250" height="82" rx="8" fill="#f3f1fa" stroke="#8977a6" stroke-width="2"/>
