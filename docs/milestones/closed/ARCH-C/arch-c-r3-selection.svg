  <text x="545" y="548" text-anchor="middle" font-size="14" fill="#5d7186" font-family="Microsoft YaHei, Arial">按 SelectionKey 投影选中项</text>

  <rect x="930" y="485" width="200" height="85" rx="8" fill="#eef5fb" stroke="#6688a9" stroke-width="2"/>
  <text x="1030" y="520" text-anchor="middle" font-size="18" fill="#304f6c" font-family="Microsoft YaHei, Arial">右侧 Inspector</text>
  <text x="1030" y="548" text-anchor="middle" font-size="14" fill="#5d7186" font-family="Microsoft YaHei, Arial">直接绑定同一快照</text>

  <rect x="55" y="330" width="285" height="150" rx="8" fill="#fff" stroke="#c7d2df" stroke-width="2"/>
  <text x="197" y="367" text-anchor="middle" font-size="17" fill="#34495e" font-family="Microsoft YaHei, Arial">R3 范围边界</text>
  <text x="80" y="401" font-size="14" fill="#607489" font-family="Microsoft YaHei, Arial">包含：选中、清空、树与检查器同步</text>
  <text x="80" y="431" font-size="14" fill="#607489" font-family="Microsoft YaHei, Arial">不包含：Gizmo、Transform、Undo</text>
  <text x="80" y="461" font-size="14" fill="#607489" font-family="Microsoft YaHei, Arial">不修改：Vulkan 生命周期与管线</text>
