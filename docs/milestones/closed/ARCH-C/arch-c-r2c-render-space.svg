<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="460" viewBox="0 0 1020 460">
  <rect width="1020" height="460" fill="#f7f9fc"/>
  <text x="510" y="38" text-anchor="middle" font-size="23" fill="#24364b" font-family="Microsoft YaHei, Arial">ARCH-C-R2-C：渲染接入统一空间事实</text>
  <text x="510" y="66" text-anchor="middle" font-size="14" fill="#66778a" font-family="Microsoft YaHei, Arial">让 Vulkan 画面正式消费 Core 的 Camera / Viewport / ViewProjection</text>

  <rect x="55" y="120" width="210" height="100" rx="10" fill="#edf7f1" stroke="#628f71" stroke-width="2"/>
  <text x="160" y="155" text-anchor="middle" font-size="18" fill="#376047" font-family="Microsoft YaHei, Arial">场景实体</text>
  <text x="160" y="185" text-anchor="middle" font-size="13" fill="#52715b" font-family="Microsoft YaHei, Arial">World Position</text>

  <rect x="405" y="120" width="210" height="100" rx="10" fill="#eef5fb" stroke="#6688a9" stroke-width="2"/>
  <text x="510" y="155" text-anchor="middle" font-size="18" fill="#304f6c" font-family="Microsoft YaHei, Arial">统一空间事实</text>
  <text x="510" y="185" text-anchor="middle" font-size="13" fill="#52677c" font-family="Microsoft YaHei, Arial">Camera / Viewport / ViewProjection</text>

  <rect x="755" y="120" width="210" height="100" rx="10" fill="#fff8e9" stroke="#b48d4e" stroke-width="2"/>
  <text x="860" y="155" text-anchor="middle" font-size="18" fill="#755923" font-family="Microsoft YaHei, Arial">Vulkan 渲染</text>
  <text x="860" y="185" text-anchor="middle" font-size="13" fill="#806c47" font-family="Microsoft YaHei, Arial">Push Constant + Shader</text>

  <path d="M265 170 H395" stroke="#66788b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M615 170 H745" stroke="#66788b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="150" y="300" width="720" height="80" rx="10" fill="#ffffff" stroke="#8798aa" stroke-width="2"/>
  <text x="510" y="332" text-anchor="middle" font-size="16" fill="#344b63" font-family="Microsoft YaHei, Arial">旧路径：Position 乘 Swapchain 尺寸后偏移 Viewport</text>
  <text x="510" y="360" text-anchor="middle" font-size="13" fill="#607489" font-family="Microsoft YaHei, Arial">新路径：世界位置 + ViewProjection 进入顶点着色器，画面服从同一套空间规则</text>

  <text x="510" y="425" text-anchor="middle" font-size="13" fill="#8a5f32" font-family="Microsoft YaHei, Arial">本轮红线：不做 Picking / 空间索引 / Ray-AABB / Selection / Gizmo / Undo，不重构 Vulkan 生命周期</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#66788b"/>
    </marker>
  </defs>
</svg>
