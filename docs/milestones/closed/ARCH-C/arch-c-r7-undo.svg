<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" role="img" aria-labelledby="title desc">
  <title id="title">ARCH-C-R7 最小撤销开发计划</title>
  <desc id="desc">从成功正式提交生成历史记录，通过撤销恢复正式场景事实，预览和所有取消路径禁止进入历史。</desc>
  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "Segoe UI", sans-serif; fill: #172033; }
      .title { font-size: 25px; font-weight: 700; }
      .head { font-size: 17px; font-weight: 700; }
      .small { font-size: 14px; fill: #536174; }
      .fact { fill: #f8fafc; stroke: #8593a6; stroke-width: 2; }
      .history { fill: #eef6ff; stroke: #477fb7; stroke-width: 2; }
      .pass { fill: #eef9f1; stroke: #29945a; stroke-width: 2; }
      .deny { fill: #fff1f1; stroke: #c94a4a; stroke-width: 2; }
      .future { fill: #fff8e8; stroke: #cf8a20; stroke-width: 2; }
      .arrow { stroke: #66758a; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 6 5; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#66758a"/>
    </marker>
  </defs>

  <rect width="1040" height="560" fill="#ffffff"/>
  <text x="34" y="44" class="title">ARCH-C-R7：最小撤销开发主链</text>
  <text x="34" y="72" class="small">目标：一次成功正式提交生成一条撤销事实；预览、取消、异常取消和迟到输入一律不得污染历史。</text>

  <rect x="35" y="120" width="180" height="105" rx="12" class="fact"/>
  <text x="57" y="153" class="head">变换会话</text>
  <text x="57" y="181" class="small">起始快照</text>
  <text x="57" y="203" class="small">高频预览</text>

  <rect x="270" y="120" width="180" height="105" rx="12" class="pass"/>
  <text x="292" y="153" class="head">成功正式提交</text>
  <text x="292" y="181" class="small">场景事实发生变化</text>
  <text x="292" y="203" class="small">产生 Before / After</text>

  <rect x="505" y="120" width="190" height="105" rx="12" class="history"/>
  <text x="527" y="153" class="head">编辑历史所有者</text>
  <text x="527" y="181" class="small">撤销栈</text>
  <text x="527" y="203" class="small">一次提交 = 一条记录</text>

  <rect x="750" y="120" width="180" height="105" rx="12" class="history"/>
  <text x="772" y="153" class="head">执行撤销</text>
  <text x="772" y="181" class="small">读取最近记录</text>
  <text x="772" y="203" class="small">恢复 Before</text>

  <path d="M215 172H270" class="arrow"/>
  <path d="M450 172H505" class="arrow"/>
  <path d="M695 172H750" class="arrow"/>

  <rect x="750" y="280" width="180" height="105" rx="12" class="fact"/>
  <text x="772" y="313" class="head">正式场景事实</text>
  <text x="772" y="341" class="small">恢复实体 Transform</text>
  <text x="772" y="363" class="small">不直接修改渲染画面</text>

  <rect x="505" y="280" width="190" height="105" rx="12" class="fact"/>
  <text x="527" y="313" class="head">渲染快照</text>
  <text x="527" y="341" class="small">从正式场景重新生成</text>
  <text x="527" y="363" class="small">呈现线程正常消费</text>

  <path d="M840 225V280" class="arrow"/>
  <path d="M750 332H695" class="arrow"/>

  <rect x="35" y="280" width="415" height="105" rx="12" class="deny"/>
  <text x="57" y="313" class="head">历史入口禁止项</text>
  <text x="57" y="341" class="small">预览　取消　异常取消　迟到鼠标释放　无变化提交</text>
  <text x="57" y="363" class="small">以上全部必须产生 0 条历史记录</text>

  <path d="M215 225V280" class="arrow dash"/>

  <rect x="180" y="445" width="280" height="75" rx="12" class="pass"/>
  <text x="202" y="477" class="head">R7 收口</text>
  <text x="202" y="502" class="small">提交 ↔ 撤销合同自动 + 真机通过</text>

  <rect x="580" y="445" width="280" height="75" rx="12" class="future"/>
  <text x="602" y="477" class="head">R8 综合验收</text>
  <text x="602" y="502" class="small">选择 -> 拖动 -> 提交 -> 取消 -> 撤销</text>

  <path d="M460 482H580" class="arrow"/>
</svg>
