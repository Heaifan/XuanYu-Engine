<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <rect width="1200" height="760" fill="#f7f8fa"/>
  <style>
    .title{font:700 30px "Microsoft YaHei",sans-serif;fill:#1f2937}
    .sub{font:400 16px "Microsoft YaHei",sans-serif;fill:#667085}
    .box{fill:#ffffff;stroke:#98a2b3;stroke-width:2}
    .done{fill:#edf7f0;stroke:#5b8f6a;stroke-width:2}
    .current{fill:#eef4ff;stroke:#3f6ea8;stroke-width:3}
    .future{fill:#fff8e8;stroke:#b88734;stroke-width:2}
    .h{font:700 20px "Microsoft YaHei",sans-serif;fill:#27364a}
    .t{font:400 15px "Microsoft YaHei",sans-serif;fill:#475467}
    .small{font:400 13px "Microsoft YaHei",sans-serif;fill:#667085}
    .arrow{stroke:#667085;stroke-width:3;fill:none;marker-end:url(#arrow)}
    .flow{stroke:#3f6ea8;stroke-width:3;fill:none;marker-end:url(#arrowBlue)}
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#667085"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#3f6ea8"/>
    </marker>
  </defs>

  <text x="60" y="62" class="title">ARCH-C-Plan：真实场景编辑交互闭环规划</text>
  <text x="60" y="92" class="sub">本轮只冻结契约、边界、里程碑和验收标准，不新增运行时能力</text>

  <rect x="60" y="130" width="250" height="120" rx="14" class="done"/>
  <text x="88" y="170" class="h">ARCH-A 已完成</text>
  <text x="88" y="202" class="t">依赖方向与组装边界</text>
  <text x="88" y="228" class="small">UI 不直接依赖 Vulkan</text>

  <rect x="365" y="130" width="250" height="120" rx="14" class="done"/>
  <text x="393" y="170" class="h">ARCH-B 已完成</text>
  <text x="393" y="202" class="t">输入 Session 生命周期</text>
  <text x="393" y="228" class="small">Begin / Preview / Commit / Cancel</text>

  <rect x="670" y="120" width="470" height="140" rx="14" class="current"/>
  <text x="700" y="162" class="h">ARCH-C-Plan 本轮</text>
  <text x="700" y="194" class="t">冻结 Picking、Selection、Transform、Gizmo、Undo 契约</text>
  <text x="700" y="222" class="small">产物：规划文档、SVG、里程碑、验收矩阵、风险清单</text>

  <path d="M310 190 H355" class="arrow"/>
  <path d="M615 190 H660" class="arrow"/>

  <rect x="70" y="340" width="180" height="100" rx="14" class="box"/>
  <text x="98" y="378" class="h">C-R1</text>
  <text x="98" y="407" class="t">场景实体与</text>
  <text x="98" y="430" class="t">Transform 所有权</text>

  <rect x="290" y="340" width="180" height="100" rx="14" class="box"/>
  <text x="318" y="378" class="h">C-R2</text>
  <text x="318" y="407" class="t">坐标转换与</text>
  <text x="318" y="430" class="t">CPU Picking</text>

  <rect x="510" y="340" width="180" height="100" rx="14" class="box"/>
  <text x="538" y="378" class="h">C-R3</text>
  <text x="538" y="407" class="t">真实 Selection</text>
  <text x="538" y="430" class="t">多视图同步</text>

  <rect x="730" y="340" width="180" height="100" rx="14" class="box"/>
  <text x="758" y="378" class="h">C-R4</text>
  <text x="758" y="407" class="t">Move Gizmo</text>
  <text x="758" y="430" class="t">显示与轴命中</text>

  <rect x="950" y="340" width="180" height="100" rx="14" class="box"/>
  <text x="978" y="378" class="h">C-R5</text>
  <text x="978" y="407" class="t">Transform</text>
  <text x="978" y="430" class="t">高频 Preview</text>

  <path d="M250 390 H280" class="flow"/>
  <path d="M470 390 H500" class="flow"/>
  <path d="M690 390 H720" class="flow"/>
  <path d="M910 390 H940" class="flow"/>

  <rect x="240" y="540" width="220" height="105" rx="14" class="future"/>
  <text x="270" y="580" class="h">C-R6</text>
  <text x="270" y="610" class="t">Commit / Escape Cancel</text>
  <text x="270" y="634" class="small">旧 Session 不得复活</text>

  <rect x="500" y="540" width="220" height="105" rx="14" class="future"/>
  <text x="530" y="580" class="h">C-R7</text>
  <text x="530" y="610" class="t">最小 Undo 事务</text>
  <text x="530" y="634" class="small">一次拖动只生成一条记录</text>

  <rect x="760" y="540" width="220" height="105" rx="14" class="future"/>
  <text x="790" y="580" class="h">C-R8</text>
  <text x="790" y="610" class="t">真机综合验收</text>
  <text x="790" y="634" class="small">Resize / 日志栏 / 关闭释放</text>

  <path d="M1040 440 V490 H350 V530" class="flow"/>
  <path d="M460 592 H490" class="flow"/>
  <path d="M720 592 H750" class="flow"/>

  <text x="60" y="710" class="sub">封版定义：点击真实对象 -> 统一选中 -> 拖动 Gizmo -> Preview -> Commit / Cancel -> Undo</text>
</svg>
