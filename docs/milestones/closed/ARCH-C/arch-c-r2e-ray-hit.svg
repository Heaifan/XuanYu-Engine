<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="700" viewBox="0 0 1180 700">
  <rect width="1180" height="700" fill="#f7f9fc"/>
  <text x="590" y="42" text-anchor="middle" font-size="26" fill="#24364b" font-family="Microsoft YaHei, Arial">ARCH-C-R2-E-R1：精确命中封版补强</text>
  <text x="590" y="74" text-anchor="middle" font-size="15" fill="#65758a" font-family="Microsoft YaHei, Arial">只补一致性保险和 Broad / Narrow 责任边界，不进入 Pointer、Selection 或 Vulkan</text>

  <rect x="40" y="120" width="190" height="112" rx="10" fill="#eef5fb" stroke="#6587a8" stroke-width="2"/>
  <text x="135" y="156" text-anchor="middle" font-size="18" fill="#304f6c" font-family="Microsoft YaHei, Arial">开始查询</text>
  <text x="135" y="188" text-anchor="middle" font-size="13" fill="#50677d" font-family="Microsoft YaHei, Arial">记录 SpatialRevision = R</text>
  <text x="135" y="212" text-anchor="middle" font-size="13" fill="#50677d" font-family="Microsoft YaHei, Arial">接收 WorldRay</text>

  <rect x="275" y="120" width="190" height="112" rx="10" fill="#edf7f1" stroke="#628f71" stroke-width="2"/>
  <text x="370" y="156" text-anchor="middle" font-size="18" fill="#376047" font-family="Microsoft YaHei, Arial">Broad Phase</text>
  <text x="370" y="188" text-anchor="middle" font-size="13" fill="#52715b" font-family="Microsoft YaHei, Arial">空间索引返回候选</text>
  <text x="370" y="212" text-anchor="middle" font-size="13" fill="#52715b" font-family="Microsoft YaHei, Arial">只裁剪，不裁定命中</text>

  <rect x="510" y="120" width="190" height="112" rx="10" fill="#fff8e9" stroke="#b48d4e" stroke-width="2"/>
  <text x="605" y="156" text-anchor="middle" font-size="18" fill="#755923" font-family="Microsoft YaHei, Arial">第一次校验</text>
  <text x="605" y="188" text-anchor="middle" font-size="13" fill="#806c47" font-family="Microsoft YaHei, Arial">Broad 后仍为 R</text>
  <text x="605" y="212" text-anchor="middle" font-size="13" fill="#806c47" font-family="Microsoft YaHei, Arial">否则拒绝结果</text>

  <rect x="745" y="120" width="190" height="112" rx="10" fill="#fff8e9" stroke="#b48d4e" stroke-width="2"/>
  <text x="840" y="156" text-anchor="middle" font-size="18" fill="#755923" font-family="Microsoft YaHei, Arial">Narrow Phase</text>
  <text x="840" y="188" text-anchor="middle" font-size="13" fill="#806c47" font-family="Microsoft YaHei, Arial">真实 WorldBounds</text>
  <text x="840" y="212" text-anchor="middle" font-size="13" fill="#806c47" font-family="Microsoft YaHei, Arial">Ray-AABB 精确检测</text>

  <rect x="980" y="120" width="160" height="112" rx="10" fill="#f3f1fa" stroke="#8977a6" stroke-width="2"/>
  <text x="1060" y="156" text-anchor="middle" font-size="18" fill="#594b76" font-family="Microsoft YaHei, Arial">最终校验</text>
  <text x="1060" y="188" text-anchor="middle" font-size="13" fill="#74698a" font-family="Microsoft YaHei, Arial">发布前仍为 R</text>
  <text x="1060" y="212" text-anchor="middle" font-size="13" fill="#74698a" font-family="Microsoft YaHei, Arial">才返回 HitResult</text>

  <path d="M230 176 H265" stroke="#64788d" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M465 176 H500" stroke="#64788d" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M700 176 H735" stroke="#64788d" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M935 176 H970" stroke="#64788d" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="70" y="305" width="320" height="135" rx="10" fill="#ffffff" stroke="#8798aa" stroke-width="2"/>
  <text x="230" y="340" text-anchor="middle" font-size="18" fill="#344b63" font-family="Microsoft YaHei, Arial">Revision 防混代</text>
  <text x="230" y="374" text-anchor="middle" font-size="13" fill="#607489" font-family="Microsoft YaHei, Arial">测试让变化发生在第一次校验之后</text>
  <text x="230" y="398" text-anchor="middle" font-size="13" fill="#607489" font-family="Microsoft YaHei, Arial">Narrow 期间 Update，发布前拒绝旧结果</text>

  <rect x="430" y="305" width="320" height="135" rx="10" fill="#ffffff" stroke="#8798aa" stroke-width="2"/>
  <text x="590" y="340" text-anchor="middle" font-size="18" fill="#344b63" font-family="Microsoft YaHei, Arial">Broad / Narrow 分工</text>
  <text x="590" y="374" text-anchor="middle" font-size="13" fill="#607489" font-family="Microsoft YaHei, Arial">Broad Candidate 不是 Guaranteed Hit</text>
  <text x="590" y="398" text-anchor="middle" font-size="13" fill="#607489" font-family="Microsoft YaHei, Arial">最终命中只接受 Narrow Phase 结果</text>

  <rect x="790" y="305" width="320" height="135" rx="10" fill="#ffffff" stroke="#8798aa" stroke-width="2"/>
  <text x="950" y="340" text-anchor="middle" font-size="18" fill="#344b63" font-family="Microsoft YaHei, Arial">当前树实现审计</text>
  <text x="950" y="374" text-anchor="middle" font-size="13" fill="#607489" font-family="Microsoft YaHei, Arial">叶节点 Broad Bounds = WorldBounds</text>
  <text x="950" y="398" text-anchor="middle" font-size="13" fill="#607489" font-family="Microsoft YaHei, Arial">尚无 Fat AABB 自然假阳性场景</text>

  <rect x="85" y="512" width="1010" height="96" rx="10" fill="#edf7f1" stroke="#628f71" stroke-width="2"/>
  <text x="590" y="548" text-anchor="middle" font-size="18" fill="#376047" font-family="Microsoft YaHei, Arial">R2-E-R1 收口边界</text>
  <text x="590" y="580" text-anchor="middle" font-size="14" fill="#52715b" font-family="Microsoft YaHei, Arial">允许：Core Raycast 一致性与测试补强；禁止：Pointer、Selection、Gizmo、Undo、Vulkan、Fat AABB、Mesh Picking</text>
  <text x="590" y="654" text-anchor="middle" font-size="13" fill="#5e7185" font-family="Microsoft YaHei, Arial">未来引入宽松代理 Bounds 时，必须补真实 false-positive 集成测试后才允许封版</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64788d"/>
    </marker>
  </defs>
</svg>