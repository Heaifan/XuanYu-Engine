<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" font-family="Microsoft YaHei, sans-serif">
  <rect width="960" height="640" fill="#F5F7FA"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#1F3A5F">MAP-A-R1-D5-R1-F2 无限参考网格稳定性修复</text>
  <text x="480" y="60" text-anchor="middle" font-size="14" fill="#5A6B85">版本 v0.2.24.7-fix · 分支 feat/MAP-A-map · 2026-08-03</text>

  <!-- 根因 -->
  <rect x="30" y="84" width="430" height="236" rx="10" fill="#FFFFFF" stroke="#C0504D" stroke-width="2"/>
  <text x="50" y="112" font-size="16" font-weight="bold" fill="#C0504D">真实根因（代码调查）</text>
  <text x="50" y="140" font-size="13" fill="#333">① 线宽公式参数反转（主因）</text>
  <text x="62" y="160" font-size="12" fill="#555">smoothstep(0.5, edge, f) 中 edge&lt;0.5，GLSL 未定义；</text>
  <text x="62" y="178" font-size="12" fill="#555">实际线宽 = 1/d − linePixels 像素：远处爆炸成</text>
  <text x="62" y="196" font-size="12" fill="#555">数十像素淡带，近处趋近 0 → 普通网格消失</text>
  <text x="50" y="222" font-size="13" fill="#333">② 目标间距 20px 过小 + 权重互补压掉细格</text>
  <text x="62" y="242" font-size="12" fill="#555">量化后细格屏幕间隔平均仅 ~8px，过密成噪声</text>
  <text x="50" y="268" font-size="13" fill="#333">③ 地图矩形内 discard 裁掉视野内网格</text>
  <text x="50" y="294" font-size="13" fill="#333">④ 坐标轴 α0.78/2.5px 过强，X/Y 颜色与方案相反</text>

  <!-- 修复 -->
  <rect x="500" y="84" width="430" height="236" rx="10" fill="#FFFFFF" stroke="#4F81BD" stroke-width="2"/>
  <text x="520" y="112" font-size="16" font-weight="bold" fill="#4F81BD">修复方案（已实装）</text>
  <text x="520" y="140" font-size="13" fill="#333">① 线宽标准公式 1−smoothstep(w±0.5, 像素距离)</text>
  <text x="532" y="160" font-size="12" fill="#555">细 0.75px / 主 1.10px / 轴 1.35px，屏幕恒定</text>
  <text x="520" y="186" font-size="13" fill="#333">② 目标 36px/格（×36）+ 细格/主格加深连续权重</text>
  <text x="532" y="206" font-size="12" fill="#555">主格线=细格子集：α 0.20 + 加深 0.18，跨级差 ≤0.02</text>
  <text x="520" y="232" font-size="13" fill="#333">③ 移除地图 discard，网格贯穿无限参考平面</text>
  <text x="532" y="252" font-size="12" fill="#555">共面稳定改由 gl_FragDepth 像素级深度偏移</text>
  <text x="520" y="278" font-size="13" fill="#333">④ 配色：#566A82/#344A63，X 金 #AD8550、Y 蓝 #557C9E</text>
  <text x="520" y="300" font-size="13" fill="#333">⑤ DrawPlan：网格移至地形/实体后、Gizmo 前</text>

  <!-- 绘制顺序 -->
  <rect x="30" y="336" width="430" height="140" rx="10" fill="#FFFFFF" stroke="#9BBB59" stroke-width="2"/>
  <text x="50" y="364" font-size="16" font-weight="bold" fill="#6E8B3B">最终帧绘制顺序（F2）</text>
  <text x="50" y="392" font-size="13" fill="#333">天空 → 原点 → 坐标轴 → 地形 → 实体填充</text>
  <text x="50" y="414" font-size="14" font-weight="bold" fill="#4F81BD">→ 无限参考网格 →</text>
  <text x="50" y="436" font-size="13" fill="#333">选中轮廓 → Move/Rotate/Scale Gizmo → UI</text>
  <text x="50" y="460" font-size="12" fill="#666">实体可遮挡网格；平坦地形经深度偏移稳定显示</text>

  <!-- 门禁 -->
  <rect x="500" y="336" width="430" height="140" rx="10" fill="#FFFFFF" stroke="#9BBB59" stroke-width="2"/>
  <text x="520" y="364" font-size="16" font-weight="bold" fill="#6E8B3B">自动门禁（本轮实测）</text>
  <text x="520" y="392" font-size="13" fill="#333">✅ 串行构建 12 项目 0 警告 / 0 错误</text>
  <text x="520" y="414" font-size="13" fill="#333">✅ Core 189/189 · World 435/435 · WarCore 22/22</text>
  <text x="520" y="436" font-size="13" fill="#333">✅ arch-a-guard PASS · 5+100 PASS · diff-check PASS</text>
  <text x="520" y="458" font-size="13" fill="#333">✅ glslc 字节码逐字一致（Vert 336 / Frag 1379 词）</text>

  <!-- 状态 -->
  <rect x="30" y="492" width="900" height="66" rx="10" fill="#FFF8E1" stroke="#E8A33D" stroke-width="2"/>
  <text x="480" y="520" text-anchor="middle" font-size="15" font-weight="bold" fill="#B07D1F">状态：自动门禁全绿 · 真机验收待用户执行（IPO 清单 10 项）</text>
  <text x="480" y="544" text-anchor="middle" font-size="13" fill="#8A6420">验收通过前不宣布 D5-R1 CLOSED · 不进入 D5-R2 参数编辑 · 不创建 Tag/Release</text>

  <text x="480" y="628" text-anchor="middle" font-size="11" fill="#999">玄域引擎 · 治理文档：docs/map-a-r1-d5-r1-f2-grid-stabilize.svg</text>
</svg>
