  <rect width="680" height="720" fill="#F7FAFD"/>
  <text x="36" y="42" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="24" fill="#17476F">ARCH-WORLD-R0 物理分层归属冻结</text>
  <text x="36" y="68" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12.5" fill="#52697D">v0.2.19.1-rz · Core 极度克制 · World 拥有世界事实 · 唯一权威禁止双轨 · 身份与句柄分离</text>
  <text x="400" y="104" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" fill="#52697D">实线箭头＝允许依赖</text>
  <text x="400" y="122" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" fill="#52697D">虚线框＝未来 / 未启动层</text>

  <g font-family="Microsoft YaHei, Segoe UI, sans-serif">
    <rect x="36" y="92" width="300" height="44" rx="8" fill="#FFFFFF" stroke="#A9BCCF" stroke-dasharray="6 4"/>
    <text x="186" y="119" font-size="14" fill="#7A8DA0" text-anchor="middle">兵无常势（游戏 · 未来）</text>

    <rect x="36" y="160" width="300" height="66" rx="8" fill="#FFFFFF" stroke="#A9BCCF" stroke-dasharray="6 4"/>
    <text x="52" y="186" font-size="13" fill="#52697D" font-weight="bold">XuanYu.WarCore 战争语义（未启动）</text>
    <text x="52" y="208" font-size="11" fill="#7A8DA0">MilitaryIdentity / FactionId（第一块砖）</text>

    <rect x="36" y="250" width="300" height="158" rx="8" fill="#FFFFFF" stroke="#2F80C9" stroke-width="1.6"/>
    <text x="52" y="278" font-size="15" fill="#17476F" font-weight="bold">XuanYu.World（世界与空间事实）</text>
    <text x="52" y="304" font-size="11.5" fill="#1C3346">· GlobalWorld · EntityRegistry</text>
    <text x="52" y="326" font-size="11.5" fill="#1C3346">· Region / Partition</text>
    <text x="52" y="348" font-size="11.5" fill="#1C3346">· SpatialIndexOwner（唯一权威索引）</text>
    <text x="52" y="370" font-size="11.5" fill="#1C3346">· WorldQuery（Ray / Bounds / Nearest）</text>
    <text x="52" y="392" font-size="11.5" fill="#1C3346">· SceneStateOwner（R3 归位）</text>

    <rect x="36" y="432" width="300" height="130" rx="8" fill="#FFFFFF" stroke="#D7E4F2" stroke-width="1.2"/>
    <text x="52" y="460" font-size="15" fill="#17476F" font-weight="bold">XuanYu.Core（极度克制）</text>
    <text x="52" y="486" font-size="11.5" fill="#1C3346">· EntityId 稳定身份（不含 Generation）</text>
    <text x="52" y="508" font-size="11.5" fill="#1C3346">· Vector3d / Aabb3d / Ray3d 几何数学</text>
    <text x="52" y="530" font-size="11.5" fill="#1C3346">· SimulationTime · EngineResult</text>
    <text x="52" y="552" font-size="11.5" fill="#1C3346">· 基础诊断契约（克制）</text>

    <rect x="384" y="160" width="260" height="140" rx="8" fill="#FFFFFF" stroke="#D7E4F2" stroke-width="1.2"/>
    <text x="400" y="186" font-size="15" fill="#17476F" font-weight="bold">XuanYu.Editor</text>
    <text x="400" y="210" font-size="11.5" fill="#1C3346">· ViewportPickingService</text>
    <text x="400" y="232" font-size="11.5" fill="#1C3346">· Gizmo / History / Transform Session</text>
    <text x="400" y="254" font-size="11.5" fill="#1C3346">· DefaultEditorCamera / Framing</text>
    <text x="400" y="276" font-size="11.5" fill="#1C3346">· 只提供 CameraState，无相机后门</text>

    <rect x="384" y="340" width="260" height="76" rx="8" fill="#FFFFFF" stroke="#D7E4F2" stroke-width="1.2"/>
    <text x="400" y="366" font-size="14" fill="#17476F" font-weight="bold">XuanYu.Render.Abstractions</text>
    <text x="400" y="388" font-size="11.5" fill="#1C3346">· SceneRenderSnapshot（边界 DTO）</text>
    <text x="400" y="408" font-size="11.5" fill="#1C3346">· CameraState / ViewProjectionState</text>

    <rect x="384" y="456" width="260" height="48" rx="8" fill="#FFFFFF" stroke="#D7E4F2" stroke-width="1.2"/>
    <text x="400" y="485" font-size="13" fill="#17476F" font-weight="bold">XuanYu.Render.Vulkan（唯一 Vulkan 实现）</text>
