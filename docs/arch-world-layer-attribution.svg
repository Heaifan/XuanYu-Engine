  <line x1="186" y1="136" x2="186" y2="158" stroke="#93A9BE" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrD)"/>
  <text x="10" y="350" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="9.5" fill="#52697D" transform="rotate(-90 12 350)">WarCore → Core</text>

  <rect x="36" y="590" width="608" height="114" rx="8" fill="#FCEDEB" stroke="#C0392B" stroke-width="1.2"/>
  <text x="52" y="614" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" fill="#C0392B" font-weight="bold">禁止边界（依赖禁区与双轨 / 身份红线）</text>
  <text x="52" y="636" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11.5" fill="#7A2E22">Core → World / WarCore / Editor / Vulkan　禁止</text>
  <text x="52" y="656" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11.5" fill="#7A2E22">World → WarCore / Editor / Vulkan　禁止　·　WarCore → Editor / Vulkan　禁止</text>
  <text x="52" y="676" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11.5" fill="#7A2E22">双轨禁令：Scene / Picking / Render 不得各建第二套空间索引（唯一权威：GlobalWorld → SpatialIndexOwner → WorldQuery）</text>
  <text x="52" y="696" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11.5" fill="#7A2E22">身份边界：EntityId＝稳定身份（不含 Generation）｜EntityHandle＝Index+Generation（未来）｜EntityRevision＝状态版本（未来）</text>
