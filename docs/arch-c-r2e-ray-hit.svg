<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="660" viewBox="0 0 1160 660">
  <rect width="1160" height="660" fill="#f7f9fc"/>
  <text x="580" y="42" text-anchor="middle" font-size="25" fill="#24364b" font-family="Microsoft YaHei, Arial">ARCH-C-R2-E：实体级精确命中与最近命中</text>
  <text x="580" y="72" text-anchor="middle" font-size="14" fill="#65758a" font-family="Microsoft YaHei, Arial">把可能候选收敛为真正命中且最近的实体</text>
  <rect x="45" y="125" width="190" height="110" rx="12" fill="#eef5fb" stroke="#6587a8" stroke-width="2"/>
  <text x="140" y="160" text-anchor="middle" font-size="18" fill="#304f6c" font-family="Microsoft YaHei, Arial">世界射线</text>
  <text x="140" y="190" text-anchor="middle" font-size="13" fill="#50677d" font-family="Microsoft YaHei, Arial">WorldRay</text>
  <text x="140" y="212" text-anchor="middle" font-size="13" fill="#50677d" font-family="Microsoft YaHei, Arial">最大距离 / 查询掩码</text>
  <rect x="290" y="125" width="210" height="110" rx="12" fill="#edf7f1" stroke="#628f71" stroke-width="2"/>
  <text x="395" y="160" text-anchor="middle" font-size="18" fill="#376047" font-family="Microsoft YaHei, Arial">高速空间目录</text>
  <text x="395" y="190" text-anchor="middle" font-size="13" fill="#52715b" font-family="Microsoft YaHei, Arial">R2-D Broad Phase</text>
  <text x="395" y="212" text-anchor="middle" font-size="13" fill="#52715b" font-family="Microsoft YaHei, Arial">只返回少量候选</text>
  <rect x="555" y="125" width="210" height="110" rx="12" fill="#fff8e9" stroke="#b48d4e" stroke-width="2"/>
  <text x="660" y="160" text-anchor="middle" font-size="18" fill="#755923" font-family="Microsoft YaHei, Arial">实体级精确检测</text>
  <text x="660" y="190" text-anchor="middle" font-size="13" fill="#806c47" font-family="Microsoft YaHei, Arial">Ray-AABB Narrow Phase</text>
  <text x="660" y="212" text-anchor="middle" font-size="13" fill="#806c47" font-family="Microsoft YaHei, Arial">只检查候选，不扫全场景</text>
  <rect x="820" y="125" width="210" height="110" rx="12" fill="#f3f1fa" stroke="#8977a6" stroke-width="2"/>
  <text x="925" y="160" text-anchor="middle" font-size="18" fill="#594b76" font-family="Microsoft YaHei, Arial">最近合法命中</text>
  <text x="925" y="190" text-anchor="middle" font-size="13" fill="#74698a" font-family="Microsoft YaHei, Arial">EntityKey / 距离 / 命中点</text>
  <text x="925" y="212" text-anchor="middle" font-size="13" fill="#74698a" font-family="Microsoft YaHei, Arial">稳定、确定性结果</text>
  <path d="M235 180 H280" stroke="#64788d" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M500 180 H545" stroke="#64788d" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M765 180 H810" stroke="#64788d" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="70" y="310" width="300" height="125" rx="12" fill="#ffffff" stroke="#8798aa" stroke-width="2"/>
  <text x="220" y="345" text-anchor="middle" font-size="17" fill="#344b63" font-family="Microsoft YaHei, Arial">精确命中规则</text>
  <text x="220" y="376" text-anchor="middle" font-size="13" fill="#607489" font-family="Microsoft YaHei, Arial">只接受射线正方向且不超过最大距离</text>
  <text x="220" y="400" text-anchor="middle" font-size="13" fill="#607489" font-family="Microsoft YaHei, Arial">起点在包围盒内：距离为 0</text>
  <rect x="430" y="310" width="300" height="125" rx="12" fill="#ffffff" stroke="#8798aa" stroke-width="2"/>
  <text x="580" y="345" text-anchor="middle" font-size="17" fill="#344b63" font-family="Microsoft YaHei, Arial">一致性与过期保护</text>
  <text x="580" y="376" text-anchor="middle" font-size="13" fill="#607489" font-family="Microsoft YaHei, Arial">Broad 与 Narrow 使用同一 SpatialRevision</text>
  <text x="580" y="400" text-anchor="middle" font-size="13" fill="#607489" font-family="Microsoft YaHei, Arial">禁止旧候选混用新场景事实</text>
  <rect x="790" y="310" width="300" height="125" rx="12" fill="#ffffff" stroke="#8798aa" stroke-width="2"/>
  <text x="940" y="345" text-anchor="middle" font-size="17" fill="#344b63" font-family="Microsoft YaHei, Arial">确定性最近命中</text>
  <text x="940" y="376" text-anchor="middle" font-size="13" fill="#607489" font-family="Microsoft YaHei, Arial">按正向距离选择最近对象</text>
  <text x="940" y="400" text-anchor="middle" font-size="13" fill="#607489" font-family="Microsoft YaHei, Arial">等距时采用稳定 EntityKey 规则</text>
  <rect x="95" y="500" width="970" height="92" rx="12" fill="#fff8e9" stroke="#b48d4e" stroke-width="2"/>
  <text x="580" y="533" text-anchor="middle" font-size="17" fill="#755923" font-family="Microsoft YaHei, Arial">R2-E 红线</text>
  <text x="580" y="561" text-anchor="middle" font-size="13" fill="#806c47" font-family="Microsoft YaHei, Arial">允许 O(k) 检查候选；禁止 O(N) 全场景扫描；不接真实 Pointer，不修改 Selection / Gizmo / Undo</text>
  <text x="580" y="630" text-anchor="middle" font-size="13" fill="#5e7185" font-family="Microsoft YaHei, Arial">完成后：引擎能够回答这条世界射线真正命中了哪个实体，而且哪个最近</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64788d"/></marker></defs>
</svg>
