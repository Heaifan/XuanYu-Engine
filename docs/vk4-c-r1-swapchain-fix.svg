<svg viewBox="0 0 680 430" width="100%" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>VK4-C-R1 Swapchain 重建修复对比</title>
  <desc>修复前未设 OldSwapchain 导致 ErrorNativeWindowInUseKhr；修复后传当前 Swapchain 作 OldSwapchain，创建成功后再销毁旧 Swapchain。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="340" y="26" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="500" fill="#1E293B">VK4-C-R1：Swapchain 重建修复对比</text>
  <text x="340" y="46" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748B">根因：Resize 重建未设 OldSwapchain → ErrorNativeWindowInUseKhr</text>

  <rect x="20" y="64" width="300" height="350" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
  <text x="170" y="88" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#A32D2D">修复前</text>

  <rect x="60" y="104" width="220" height="44" rx="6" fill="#FFFFFF" stroke="#A32D2D" stroke-width="0.5"/>
  <text x="170" y="131" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1E293B">Recreate 调 Build</text>

  <path d="M170 148 L170 162" fill="none" stroke="#A32D2D" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="60" y="166" width="220" height="56" rx="6" fill="#FFFFFF" stroke="#A32D2D" stroke-width="0.5"/>
  <text x="170" y="188" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1E293B">Build：CreateSwapchain</text>
  <text x="170" y="206" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#A32D2D">OldSwapchain 未设置</text>

  <path d="M170 222 L170 236" fill="none" stroke="#A32D2D" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="60" y="240" width="220" height="44" rx="6" fill="#F7C1C1" stroke="#A32D2D" stroke-width="0.5"/>
  <text x="170" y="267" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#A32D2D">窗口被旧 Swapchain 占用</text>

  <path d="M170 284 L170 298" fill="none" stroke="#A32D2D" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="60" y="302" width="220" height="100" rx="6" fill="#A32D2D"/>
  <text x="170" y="338" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#FFFFFF">CreateSwapchain 失败</text>
  <text x="170" y="362" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#FFFFFF">ErrorNativeWindowInUseKhr</text>

  <rect x="360" y="64" width="300" height="350" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
  <text x="510" y="88" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#3B6D11">修复后</text>

  <rect x="400" y="104" width="220" height="44" rx="6" fill="#FFFFFF" stroke="#3B6D11" stroke-width="0.5"/>
  <text x="510" y="131" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1E293B">Recreate 调 Build</text>

  <path d="M510 148 L510 162" fill="none" stroke="#3B6D11" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="400" y="166" width="220" height="56" rx="6" fill="#FFFFFF" stroke="#3B6D11" stroke-width="0.5"/>
  <text x="510" y="188" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1E293B">Build：CreateSwapchain</text>
  <text x="510" y="206" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#3B6D11">OldSwapchain = 当前</text>

  <path d="M510 222 L510 236" fill="none" stroke="#3B6D11" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="400" y="240" width="220" height="44" rx="6" fill="#C0DD97" stroke="#3B6D11" stroke-width="0.5"/>
  <text x="510" y="267" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3B6D11">驱动退役旧 Swapchain</text>

  <path d="M510 284 L510 298" fill="none" stroke="#3B6D11" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="400" y="302" width="220" height="100" rx="6" fill="#3B6D11"/>
  <text x="510" y="334" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#FFFFFF">Swapchain 创建成功</text>
  <text x="510" y="356" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#FFFFFF">再 DestroyImagesAndViews</text>
  <text x="510" y="374" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#FFFFFF">(先 ImageView 后 Swapchain)</text>

  <text x="340" y="420" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748B">Builder.Build 新增 oldSwapchain 参数；CreateSwapchain 设 info.OldSwapchain；Recreate 传当前 _swapchain</text>
</svg>
