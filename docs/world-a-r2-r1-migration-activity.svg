<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620">
  <rect width="1120" height="620" fill="#f8fafc"/>
  <text x="560" y="52" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="30" fill="#233247">WORLD-A-R2-R1 跨区迁移与活跃态</text>
  <rect x="80" y="110" width="260" height="330" rx="10" fill="#e8f2ff" stroke="#4b86d1" stroke-width="2"/>
  <text x="210" y="148" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="22" fill="#1c5c9c">Transform Preview</text>
  <text x="118" y="195" font-family="Microsoft YaHei, Arial" font-size="18" fill="#233247">可显示候选位置</text>
  <text x="118" y="230" font-family="Microsoft YaHei, Arial" font-size="18" fill="#233247">不写 Membership</text>
  <text x="118" y="265" font-family="Microsoft YaHei, Arial" font-size="18" fill="#233247">Cancel 后仍在原 Region</text>
  <rect x="430" y="110" width="260" height="330" rx="10" fill="#eaf8ef" stroke="#46a268" stroke-width="2"/>
  <text x="560" y="148" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="22" fill="#277043">Transform Commit</text>
  <text x="468" y="195" font-family="Microsoft YaHei, Arial" font-size="18" fill="#233247">正式 Position 落地</text>
  <text x="468" y="230" font-family="Microsoft YaHei, Arial" font-size="18" fill="#233247">策略推导 RegionKey</text>
  <text x="468" y="265" font-family="Microsoft YaHei, Arial" font-size="18" fill="#233247">原子更新 Membership</text>
  <rect x="780" y="110" width="260" height="330" rx="10" fill="#fff4df" stroke="#d69a32" stroke-width="2"/>
  <text x="910" y="148" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="22" fill="#9a650e">Undo / Redo</text>
  <text x="818" y="195" font-family="Microsoft YaHei, Arial" font-size="18" fill="#233247">只恢复 Position</text>
  <text x="818" y="230" font-family="Microsoft YaHei, Arial" font-size="18" fill="#233247">Region 重新推导</text>
  <text x="818" y="265" font-family="Microsoft YaHei, Arial" font-size="18" fill="#233247">不保存第二套 Region 真相</text>
  <path d="M340 260 H430" stroke="#667085" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M690 260 H780" stroke="#667085" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="185" y="485" width="750" height="70" rx="8" fill="#ffffff" stroke="#aab7c8"/>
  <text x="560" y="529" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="22" fill="#233247">EntityId 不变；Region 只是管理归属；Activity 不是可见性</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#667085"/>
    </marker>
  </defs>
</svg>
