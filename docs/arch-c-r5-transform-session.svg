<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">ARCH-C-R5 变换预览 / 提交 / 取消</title>
  <desc id="desc">R5 区分正式变换、拖动起始快照、预览变换和单槽渲染预览更新。</desc>
  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "Segoe UI", sans-serif; fill: #0f172a; }
      .title { font-size: 24px; font-weight: 700; }
      .label { font-size: 15px; font-weight: 700; }
      .small { font-size: 13px; fill: #475569; }
      .box { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; rx: 12; }
      .owner { fill: #ecfeff; stroke: #0891b2; }
      .preview { fill: #fff7ed; stroke: #f97316; }
      .commit { fill: #f0fdf4; stroke: #16a34a; }
      .cancel { fill: #fef2f2; stroke: #dc2626; }
      .arrow { stroke: #334155; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 6 5; }
      .axis-x { stroke: #ef4444; }
      .axis-y { stroke: #22c55e; }
      .axis-z { stroke: #3b82f6; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect width="900" height="520" fill="#ffffff"/>
  <text x="34" y="44" class="title">ARCH-C-R5：变换预览 / 提交 / 取消</text>
  <text x="34" y="72" class="small">单实体、世界 X/Y/Z 位置；指针移动高频预览不写正式场景，不停止或重启呈现。</text>

  <rect x="42" y="112" width="170" height="94" class="box owner"/>
  <text x="64" y="145" class="label">编辑器交互状态</text>
  <text x="64" y="172" class="small">唯一会话标识</text>
  <text x="64" y="192" class="small">捕获 / 指针合同</text>

  <rect x="278" y="112" width="188" height="94" class="box"/>
  <text x="300" y="145" class="label">变换会话</text>
  <text x="300" y="172" class="small">起始快照</text>
  <text x="300" y="192" class="small">轴向 + 预览</text>

  <rect x="532" y="112" width="160" height="94" class="box preview"/>
  <text x="554" y="145" class="label">预览变换</text>
  <text x="554" y="172" class="small">只读渲染位置</text>
  <text x="554" y="192" class="small">可高频覆盖</text>

  <rect x="730" y="112" width="128" height="94" class="box preview"/>
  <text x="752" y="145" class="label">呈现线程</text>
  <text x="752" y="172" class="small">栅栏安全点</text>
  <text x="752" y="192" class="small">单槽消费</text>

  <path d="M212 159 H278" class="arrow"/>
  <path d="M466 159 H532" class="arrow"/>
  <path d="M692 159 H730" class="arrow"/>

  <rect x="42" y="266" width="170" height="100" class="box commit"/>
  <text x="64" y="300" class="label">正式变换</text>
  <text x="64" y="327" class="small">场景状态所有者</text>
  <text x="64" y="347" class="small">正式位置事实</text>

  <rect x="278" y="266" width="188" height="100" class="box commit"/>
  <text x="300" y="300" class="label">鼠标释放提交</text>
  <text x="300" y="327" class="small">最多一次正式写入</text>
  <text x="300" y="347" class="small">之后会话失效</text>

  <rect x="532" y="266" width="160" height="100" class="box cancel"/>
  <text x="554" y="300" class="label">取消会话</text>
  <text x="554" y="327" class="small">Esc / 系统取消</text>
  <text x="554" y="347" class="small">丢弃预览</text>

  <rect x="730" y="266" width="128" height="100" class="box cancel"/>
  <text x="752" y="300" class="label">迟到的鼠标释放</text>
  <text x="752" y="327" class="small">会话已失效</text>
  <text x="752" y="347" class="small">不得复活提交</text>

  <path d="M372 206 V266" class="arrow"/>
  <path d="M278 316 H212" class="arrow"/>
  <path d="M612 206 V266" class="arrow dash"/>
  <path d="M692 316 H730" class="arrow dash"/>

  <line x1="82" y1="438" x2="196" y2="438" class="arrow axis-x"/>
  <line x1="82" y1="438" x2="82" y2="394" class="arrow axis-y"/>
  <line x1="82" y1="438" x2="132" y2="410" class="arrow axis-z"/>
  <text x="222" y="412" class="small">拖动数学：屏幕位移投影到已命中的 X / Y / Z 轴，只改变对应世界分量。</text>
  <text x="222" y="438" class="small">范围红线：不做撤销、旋转、缩放、局部坐标、吸附、多选、地平面、原点、世界轴、天空盒。</text>
  <text x="222" y="464" class="small">项目进度：R5 已覆盖预览 + 提交 + 取消合同；下一步进入最小撤销，真机综合验收仍待人工确认。</text>
</svg>
