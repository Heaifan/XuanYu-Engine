<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" font-family="Microsoft YaHei, sans-serif">
  <rect width="960" height="640" fill="#F5F7FA"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1F2937">MAP-A-R1-D5-R1-F2-R3 · 网格线宽统一 + 中性灰参考地面</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#6B7280">v0.2.24.8-fix → v0.2.24.9-fix · 唯一线宽 0.82px · 非累加合成 · Unity 风格灰色编辑器地面</text>

  <rect x="40" y="84" width="880" height="150" rx="10" fill="#FFFFFF" stroke="#D1D5DB"/>
  <text x="60" y="112" font-size="15" font-weight="bold" fill="#111827">R3-A：格距可变 · 透明度可变 · 普通网格线宽不变</text>
  <text x="60" y="138" font-size="13" fill="#374151">原问题：Fine 0.70px / Coarse 1.00px 双线宽 + 重合处直接相加 → 忽粗忽细、明暗脉冲、粗黑线</text>
  <text x="60" y="162" font-size="13" fill="#374151">现改为：唯一 GRID_LINE_WIDTH_PX = 0.82（合同 0.78~0.90，≤1.0）—— Fine 与 Coarse 同一函数同一宽度</text>
  <text x="60" y="186" font-size="13" fill="#374151">重合合成：gridAlpha = max(fineContribution, coarseContribution) —— 禁止相加，无双重 Alpha</text>
  <text x="60" y="210" font-size="13" fill="#374151">配色收敛：Fine #5D6670 α0.16 / Coarse #525C67 α0.24（差 0.08 ≤ 0.10，防"深色=更粗"错觉）</text>
  <text x="60" y="234" font-size="13" fill="#6B7280">未触碰：1/2/5 选级 · 48px 目标 · LOD 互补权重 · 方向性抗摩尔纹 · 深度偏移 · 世界轴 1.25px 独立</text>

  <rect x="40" y="250" width="880" height="150" rx="10" fill="#FFFFFF" stroke="#D1D5DB"/>
  <text x="60" y="278" font-size="15" font-weight="bold" fill="#111827">R3-B：程序化编辑器环境（场景背景 Shader，不新增 Pass）</text>
  <rect x="60" y="292" width="120" height="14" fill="#9DBBE0"/><text x="192" y="304" font-size="12" fill="#374151">#9DBBE0 天空顶部</text>
  <rect x="60" y="310" width="120" height="14" fill="#AEC4DC"/><text x="192" y="322" font-size="12" fill="#374151">#AEC4DC 天空近地平线</text>
  <rect x="60" y="328" width="120" height="14" fill="#9DA5AD"/><text x="192" y="340" font-size="12" fill="#374151">#9DA5AD 地平线混合区</text>
  <rect x="60" y="346" width="120" height="14" fill="#8B9299"/><text x="192" y="358" font-size="12" fill="#374151">#8B9299 远处地面</text>
  <rect x="60" y="364" width="120" height="14" fill="#7B8289"/><text x="192" y="376" font-size="12" fill="#374151">#7B8289 近处地面</text>
  <text x="420" y="304" font-size="13" fill="#374151">地平线过渡按视线方向 dir.z（[-0.06,0] 柔和混合，无硬切线）</text>
  <text x="420" y="328" font-size="13" fill="#374151">地面远近轻微渐变（dir.z ∈ [-0.06,-0.5]），防水平色带</text>
  <text x="420" y="352" font-size="13" fill="#374151">语义：纯视口背景——不写深度、不进地图/场景/拾取/碰撞</text>
  <text x="420" y="376" font-size="13" fill="#374151">跟随"环境"开关；地图与实体在后续 Pass 自然覆盖灰地</text>

  <rect x="40" y="416" width="880" height="120" rx="10" fill="#FFFFFF" stroke="#D1D5DB"/>
  <text x="60" y="444" font-size="15" font-weight="bold" fill="#111827">渲染顺序（不变）与遮挡关系</text>
  <text x="60" y="470" font-size="13" fill="#374151">程序化背景（天空+灰地）→ 地图地形 → 无限参考网格 → 原点 → 世界轴 → 实体填充 → 轮廓 → Gizmo</text>
  <text x="60" y="494" font-size="13" fill="#374151">背景不写深度 → 地图覆盖灰地；网格有界深度偏移 → 平坦地形共面稳定、丘陵遮挡正常</text>
  <text x="60" y="518" font-size="13" fill="#374151">开关独立：环境（天空+灰地）/ 网格 / 世界轴 / 原点各自独立，互不绑定</text>

  <rect x="40" y="552" width="880" height="66" rx="10" fill="#FFFFFF" stroke="#D1D5DB"/>
  <text x="60" y="578" font-size="13" fill="#6B7280">门禁：Core 224 / World 435 / WarCore 22 全过 · arch-a-guard PASS · glslc 字节码逐字 MATCH</text>
  <text x="60" y="600" font-size="13" fill="#6B7280">视觉冒烟未执行（用户选择跳过）——F2-R3-A3 十项真机验收清单待用户执行</text>
</svg>
