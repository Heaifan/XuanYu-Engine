<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" font-family="Microsoft YaHei, sans-serif">
  <rect width="960" height="640" fill="#F5F7FA"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1F2937">MAP-A-R1-D5-R1-F3-F1 · 屏幕空间原点标记 + Vulkan 导航 Gizmo Overlay</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#6B7280">v0.2.24.11-fix → v0.2.24.12-fix · 原生子窗口 airspace 调查结论 · 不再调 XAML</text>

  <rect x="40" y="84" width="880" height="150" rx="10" fill="#FFFFFF" stroke="#D1D5DB"/>
  <text x="60" y="112" font-size="15" font-weight="bold" fill="#111827">调查结论：为什么 Gizmo 真机零像素</text>
  <text x="60" y="138" font-size="13" fill="#374151">VulkanNativeHost 继承 NativeControlHost，内部创建 WS_CHILD 原生子窗口（Win32ViewportHost.CreateChild）</text>
  <text x="60" y="162" font-size="13" fill="#374151">原生 HWND 与 Avalonia 内容不在同一合成层——Avalonia 覆盖层被原生子窗口完全遮挡（airspace 问题）</text>
  <text x="60" y="186" font-size="13" fill="#374151">ZIndex / Margin / Opacity / IsHitTestVisible / Grid 层级 均无效 → 放弃 Avalonia 覆盖层</text>
  <text x="60" y="210" font-size="13" fill="#6B7280">命中改走原生指针消息流（SetInputSink → OnNativePointerMessage），视口坐标 → Gizmo 局部坐标</text>

  <rect x="40" y="250" width="880" height="150" rx="10" fill="#FFFFFF" stroke="#D1D5DB"/>
  <text x="60" y="278" font-size="15" font-weight="bold" fill="#111827">世界原点：贴地黄色面片 → 屏幕空间标记</text>
  <text x="60" y="306" font-size="13" fill="#374151">旧实现：射线与 Z=0 求交 + fwidth 世界导数 → 低角度透视压扁成黄色梯形</text>
  <g transform="translate(300,370)">
    <line x1="0" y1="-16" x2="0" y2="16" stroke="#718096" stroke-width="2"/>
    <line x1="-16" y1="0" x2="16" y2="0" stroke="#718096" stroke-width="2"/>
    <circle cx="0" cy="0" r="10" fill="none" stroke="#718096" stroke-width="2"/>
    <circle cx="0" cy="0" r="3" fill="#C18A55"/>
  </g>
  <text x="420" y="306" font-size="13" fill="#374151">新实现：世界原点 (0,0,0) 投影到屏幕后画恒定尺寸标记</text>
  <text x="420" y="330" font-size="13" fill="#374151">细十字线（半长 8px）+ 小空心圆（半径 5px）+ 中心淡金褐点（#C18A55）</text>
  <text x="420" y="354" font-size="13" fill="#374151">蓝灰描边 #718096；恒定 10~16 DIP；相机后方/屏幕外 discard；不随视角压扁</text>
  <text x="420" y="378" font-size="13" fill="#374151">深度保持原点平面深度（实体近则自然遮挡）；低饱和，不和大面积黄色混同</text>

  <rect x="40" y="416" width="880" height="160" rx="10" fill="#FFFFFF" stroke="#D1D5DB"/>
  <text x="60" y="444" font-size="15" font-weight="bold" fill="#111827">导航 Gizmo → Vulkan 屏幕空间 Overlay Pass</text>
  <circle cx="260" cy="520" r="15" fill="#CDD6DF" stroke="#718096" stroke-width="1.5"/>
  <line x1="260" y1="520" x2="260" y2="468" stroke="#C18A55" stroke-width="2"/><circle cx="260" cy="462" r="6" fill="#C18A55"/><text x="256" y="465" font-size="8" fill="#fff">X</text>
  <line x1="260" y1="520" x2="286" y2="520" stroke="#5F87A7" stroke-width="2"/><circle cx="292" cy="520" r="6" fill="#5F87A7"/><text x="288" y="523" font-size="8" fill="#fff">Y</text>
  <line x1="260" y1="520" x2="286" y2="492" stroke="#A9B8C7" stroke-width="2"/><circle cx="292" cy="486" r="6" fill="#A9B8C7"/><text x="288" y="489" font-size="8" fill="#fff">Z</text>
  <circle cx="234" cy="528" r="4" fill="#A9B8C7" opacity="0.4"/>
  <text x="420" y="444" font-size="13" fill="#374151">新 Pass：editor_nav_gizmo.vert/.frag，DrawPlan 恒最后绘制，DepthTest/Write 关闭</text>
  <text x="420" y="468" font-size="13" fill="#374151">右上角 12 DIP 边距、88 DIP 区域；中心球 #CDD6DF + 三轴（X #C18A55/Y #5F87A7/Z #A9B8C7）</text>
  <text x="420" y="492" font-size="13" fill="#374151">六端点投影：screenX=dot(d,Right) screenY=-dot(d,Up) depth=dot(d,Forward)，深度排序背向先画</text>
  <text x="420" y="516" font-size="13" fill="#374151">背向 40% Alpha 小点、朝向 100% 大点带 X/Y/Z 标签；hover 索引经 push 高亮</text>
  <text x="420" y="540" font-size="13" fill="#374151">点击六端点 → 标准视角（+X/-X/+Y/-Y/顶/底，保留 Pivot 距离）；拖动 → 复用相机会话 Orbit</text>
  <text x="420" y="564" font-size="13" fill="#6B7280">命中：原生指针流（LeftDown 先判右上角区域）；区域外不截获；不进入 Dirty/Undo</text>

  <rect x="40" y="592" width="880" height="30" rx="8" fill="#FFFFFF" stroke="#D1D5DB"/>
  <text x="60" y="612" font-size="13" fill="#6B7280">门禁：Core 258 / World 435 / WarCore 22 全过 · arch-a-guard PASS · glslc 字节码 MATCH · 待用户真机验收</text>
</svg>
