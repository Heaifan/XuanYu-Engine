<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc">
  <title id="title">ARCH-C-R8 staged acceptance status</title>
  <desc id="desc">Core edit chain passed true-machine checks; three final combined lifecycle checks are still pending.</desc>
  <defs>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #172033; }
      .title { font-size: 26px; font-weight: 700; }
      .head { font-size: 17px; font-weight: 700; }
      .small { font-size: 14px; fill: #536174; }
      .done { fill: #eef9f1; stroke: #29945a; stroke-width: 2; }
      .partial { fill: #eef6ff; stroke: #477fb7; stroke-width: 2; }
      .wait { fill: #fff8e8; stroke: #cf8a20; stroke-width: 2; }
      .arrow { stroke: #66758a; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#66758a"/>
    </marker>
  </defs>

  <rect width="1080" height="560" fill="#ffffff"/>
  <text x="34" y="45" class="title">ARCH-C-R8: staged true-machine acceptance passed</text>
  <text x="34" y="75" class="small">Core chain has evidence; final ARCH-C closure still needs three combined lifecycle checks.</text>

  <rect x="40" y="125" width="190" height="110" rx="12" class="done"/>
  <text x="62" y="160" class="head">Picking / Selection</text>
  <text x="62" y="190" class="small">EntityId(1) picked</text>
  <text x="62" y="214" class="small">Selection committed</text>

  <rect x="285" y="125" width="190" height="110" rx="12" class="done"/>
  <text x="307" y="160" class="head">Transform axes</text>
  <text x="307" y="190" class="small">X / Y / Z commit</text>
  <text x="307" y="214" class="small">History generated</text>

  <rect x="530" y="125" width="190" height="110" rx="12" class="done"/>
  <text x="552" y="160" class="head">Cancel / Undo</text>
  <text x="552" y="190" class="small">Escape / cancel passed</text>
  <text x="552" y="214" class="small">Undo main chain passed</text>

  <rect x="775" y="125" width="250" height="110" rx="12" class="done"/>
  <text x="797" y="160" class="head">LOG-UX fixes</text>
  <text x="797" y="190" class="small">Tail scroll restored</text>
  <text x="797" y="214" class="small">Window-level copy fixed</text>

  <path d="M230 180H285" class="arrow"/>
  <path d="M475 180H530" class="arrow"/>
  <path d="M720 180H775" class="arrow"/>

  <rect x="90" y="335" width="260" height="115" rx="12" class="wait"/>
  <text x="112" y="370" class="head">Pending 1: captured Ctrl+Z</text>
  <text x="112" y="400" class="small">Ctrl+Z while drag is captured</text>
  <text x="112" y="424" class="small">No split Scene / Session fact</text>

  <rect x="410" y="335" width="260" height="115" rx="12" class="wait"/>
  <text x="432" y="370" class="head">Pending 2: resize full chain</text>
  <text x="432" y="400" class="small">Commit to Resize to Undo</text>
  <text x="432" y="424" class="small">to Picking to Transform</text>

  <rect x="730" y="335" width="260" height="115" rx="12" class="wait"/>
  <text x="752" y="370" class="head">Pending 3: normal close</text>
  <text x="752" y="400" class="small">Latest Vulkan release chain</text>
  <text x="752" y="424" class="small">No late thread / crash / access fault</text>

  <rect x="315" y="490" width="450" height="48" rx="12" class="partial"/>
  <text x="338" y="521" class="head">ARCH-C final closure requires all three pending checks</text>
</svg>
