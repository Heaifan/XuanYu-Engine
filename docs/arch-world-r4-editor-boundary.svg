<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 560">
  <desc>ARCH-WORLD R4 Editor 领域边界图：Core/World → XuanYu.Editor → XuanYu.Editor.UI 依赖方向、TransformSession 与 EditorCameraFraming 迁移、World 写入权不变、R5 待处理范围与依赖禁区。</desc>
  <rect x="0" y="0" width="680" height="560" fill="#F7F9FC"/>

  <text x="24" y="34" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="16" font-weight="bold" fill="#1F2D3D">ARCH-WORLD R4 · Editor 领域边界（v0.2.19.4-rz）</text>
  <text x="24" y="52" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10.5" fill="#5A6B7B">依赖方向：Editor.UI → Editor → Core / World（自上而下）；Editor 不持有实体永久位置。</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5A6B7B"/>
    </marker>
  </defs>

  <rect x="240" y="72" width="200" height="56" rx="8" fill="#D6E4FF" stroke="#3B6FB5" stroke-width="2"/>
  <text x="340" y="96" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#1F2D3D">XuanYu.Editor.UI</text>
  <text x="340" y="116" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10.5" fill="#33475B">Avalonia 界面 · ViewModel · 输入适配 · 组合根</text>

  <rect x="240" y="208" width="200" height="56" rx="8" fill="#D9F2E6" stroke="#2E8B57" stroke-width="2"/>
  <text x="340" y="232" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#1F2D3D">XuanYu.Editor</text>
  <text x="340" y="252" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10.5" fill="#1F4D33">编辑器领域规则 · 操作会话 · 相机算法</text>

  <rect x="60" y="364" width="200" height="56" rx="8" fill="#EDE7F6" stroke="#6A4FB3" stroke-width="2"/>
  <text x="160" y="388" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#1F2D3D">XuanYu.Core</text>
  <text x="160" y="408" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10.5" fill="#3B2E66">通用机制与稳定契约</text>

  <rect x="420" y="364" width="200" height="56" rx="8" fill="#FDEBD0" stroke="#C77B30" stroke-width="2"/>
  <text x="520" y="388" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#1F2D3D">XuanYu.World</text>
  <text x="520" y="408" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10.5" fill="#6B4A1C">实体/Transform/Region/空间查询 唯一真相</text>

  <line x1="340" y1="128" x2="340" y2="204" stroke="#5A6B7B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="300" y1="264" x2="205" y2="358" stroke="#5A6B7B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="380" y1="264" x2="475" y2="358" stroke="#5A6B7B" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="456" y="190" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10.5" font-weight="bold" fill="#2E8B57">迁移① EditorCameraFraming</text>
  <text x="456" y="208" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10" fill="#33475B">Core.Space → Editor.Camera（纯函数）</text>
  <text x="456" y="234" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10.5" font-weight="bold" fill="#2E8B57">迁移② TransformSession</text>
  <text x="456" y="252" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10" fill="#33475B">World.Transform → Editor.Transform</text>

  <rect x="60" y="440" width="560" height="34" rx="6" fill="#EAF7EF" stroke="#2E8B57" stroke-width="1.5"/>
  <text x="74" y="462" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" fill="#1F4D33">World 写入权不变：TransformSession.Commit → SceneStateOwner → GlobalWorld（唯一权威，Editor 不持有实体永久位置）</text>

  <rect x="60" y="482" width="560" height="34" rx="6" fill="#FFF7E6" stroke="#C77B30" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="74" y="504" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" fill="#6B4A1C">R5 待处理（不在 R4-R1）：DefaultEditorCamera.Create(0) 后门 · SceneRenderSnapshot · ISceneRenderSnapshotSource 拆分</text>

  <rect x="60" y="524" width="560" height="28" rx="6" fill="#FDECEC" stroke="#C0392B" stroke-width="1.5"/>
  <text x="74" y="543" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" fill="#922B21">依赖禁区：Editor ✕ Editor.UI(反向) / Avalonia / Vulkan / Silk；Core·World ✕ Editor(反向)</text>
</svg>
