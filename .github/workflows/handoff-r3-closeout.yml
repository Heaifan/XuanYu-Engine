name: Handoff R3 Closeout

on:
  push:
    branches:
      - feat/v0.3-world-authoring-r1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  handoff-r3-closeout:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      NUGET_XMLDOC_MODE: skip

    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Configure Git fixture identity
        shell: pwsh
        run: |
          git config --global user.email "handoff-ci@example.invalid"
          git config --global user.name "handoff-ci"

      - name: Candidate facts
        shell: pwsh
        run: |
          Write-Host "HEAD=$(git rev-parse HEAD)"
          Write-Host "BRANCH=$(git branch --show-current)"
          git status --short
          if (git status --porcelain) {
            throw "CI checkout must begin clean."
          }
          dotnet --info

      - name: Bootstrap - Windows PowerShell 5.1
        shell: powershell
        run: |
          & .\scripts\xye-bootstrap.ps1

      - name: Handoff H1 authority and lifecycle - PS5.1
        shell: powershell
        run: |
          & .\tools\handoff\handoff.selftest.ps1
          & .\tools\handoff\state-lifecycle.selftest.ps1
          & .\tools\handoff\active-wave-migration.selftest.ps1

      - name: Handoff process runner - PS5.1
        shell: powershell
        run: |
          & .\tools\handoff\process-runner.selftest.ps1

      - name: H2 evidence and dirty fingerprint - PS5.1
        shell: powershell
        run: |
          & .\scripts\governance\h2-evidence.selftest.ps1
          & .\tools\handoff\dirty-content-fingerprint.selftest.ps1

      - name: H3 dependency handoff - PS5.1
        shell: powershell
        run: |
          & .\tools\handoff\dependency-handoff.selftest.ps1

      - name: XYT executor contract - Windows PowerShell 5.1
        shell: powershell
        run: |
          & .\XYT\Execution\xyt-executor.selftest.ps1
          & .\XYT\Execution\xyt-executor-deadlock.selftest.ps1

      - name: XYT executor contract - pwsh
        shell: pwsh
        run: |
          & .\XYT\Execution\xyt-executor.selftest.ps1
          & .\XYT\Execution\xyt-executor-deadlock.selftest.ps1

      - name: H4 adversarial 18-case suite
        shell: powershell
        run: |
          & .\tools\handoff\adversarial-selftest.ps1

      - name: Governance regression suites
        shell: powershell
        run: |
          & .\scripts\governance\test-evidence-gate.selftest.ps1
          & .\scripts\governance\regression-witness-gate.selftest.ps1
          & .\scripts\governance\deferred-capability-gate.selftest.ps1
          & .\scripts\governance\xyt-evidence.selftest.ps1
          & .\scripts\governance\xyt-incident.selftest.ps1
          & .\scripts\governance\xyt-runtime-artifact-gate.selftest.ps1
          & .\scripts\governance\xyt-runner.selftest.ps1

      - name: XYT contract suites
        shell: pwsh
        run: |
          & .\XYT\tests\xyt.selftest.ps1
          & .\XYT\tests\xyt.aggregate.selftest.ps1
          & .\XYT\tests\work-release.selftest.ps1
          & .\XYT\Integration\xyt-module-contract.selftest.ps1
          & .\XYT\Witness\xyt-witness.selftest.ps1
          & .\XYT\Report\xyt-report.selftest.ps1

      - name: Knowledge and version governance
        shell: powershell
        run: |
          & .\tools\governance\knowledge-preflight.selftest.ps1
          & .\tools\governance\knowledge-audit-handoff.selftest.ps1
          & .\tools\governance\version-selftest.ps1
          & .\scripts\governance\version-event-gate.selftest.ps1

      - name: ARCH-A and 5+100
        shell: powershell
        run: |
          & .\scripts\arch-a-guard.ps1

      - name: Restore solution
        shell: powershell
        run: |
          & .\scripts\xye-dotnet.ps1 restore .\XuanYu.Engine.slnx --configfile .\NuGet.Config -nologo

      - name: Build solution
        shell: powershell
        run: |
          & .\scripts\xye-dotnet.ps1 build .\XuanYu.Engine.slnx --no-restore -nologo -m 1 -nr false -p UseSharedCompilation=false

      - name: Core tests
        shell: powershell
        run: |
          & .\scripts\xye-dotnet.ps1 test .\XuanYu.Core.Tests\XuanYu.Core.Tests.csproj --no-build -nologo

      - name: WarCore tests
        shell: powershell
        run: |
          & .\scripts\xye-dotnet.ps1 test .\XuanYu.WarCore.Tests\XuanYu.WarCore.Tests.csproj --no-build -nologo

      - name: World tests
        shell: powershell
        run: |
          & .\scripts\xye-dotnet.ps1 test .\XuanYu.World.Tests\XuanYu.World.Tests.csproj --no-build -nologo

      - name: XYUI tests
        shell: powershell
        run: |
          & .\scripts\xye-dotnet.ps1 test .\xyui\avalonia\tests\XYUI.Avalonia.Tests\XYUI.Avalonia.Tests.csproj --no-build -nologo

      - name: Final clean-tree check
        shell: pwsh
        run: |
          $dirty = @(git status --porcelain=v1 --untracked-files=all)
          if ($dirty.Count -gt 0) {
            $dirty | ForEach-Object { Write-Host $_ }
            throw "Closeout verification mutated the checked-out candidate."
          }
          Write-Host "CLOSEOUT_CANDIDATE_TREE_CLEAN"
