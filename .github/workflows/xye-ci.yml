name: 玄域持续集成

on:
  push:
    branches:
      - feat/v0.3-world-authoring-r1
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: xye-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400

      - name: 还原依赖
        run: dotnet restore XuanYu.Engine.slnx

      - name: 编译解决方案
        run: dotnet build XuanYu.Engine.slnx --configuration Release --no-restore

      - name: Core 测试
        run: dotnet test XuanYu.Core.Tests/XuanYu.Core.Tests.csproj --configuration Release --no-build

      - name: World 集成测试
        run: dotnet test XuanYu.World.Tests/XuanYu.World.Tests.csproj --configuration Release --no-build

      - name: Editor 测试
        run: dotnet test XuanYu.Editor.Tests/XuanYu.Editor.Tests.csproj --configuration Release --no-build

      - name: WarCore 测试
        run: dotnet test XuanYu.WarCore.Tests/XuanYu.WarCore.Tests.csproj --configuration Release --no-build

      - name: XYUI 测试
        run: dotnet test xyui/avalonia/tests/XYUI.Avalonia.Tests/XYUI.Avalonia.Tests.csproj --configuration Release --no-build
